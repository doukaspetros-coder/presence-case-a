name: Publish presence field

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build page and presence index
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import math
          import os
          import re
          import shutil
          import subprocess
          import tarfile
          from pathlib import Path

          def parse_score(path, raw_bytes):
              try:
                  payload = json.loads(raw_bytes.decode("utf-8"))
              except (UnicodeDecodeError, json.JSONDecodeError):
                  return None
              if not isinstance(payload, dict):
                  return None
              title = payload.get("title", Path(path).stem)
              tempo = payload.get("tempo", 96)
              meter = payload.get("meter", "4/4")
              measures = payload.get("measures")
              if (not isinstance(title, str) or not title.strip() or len(title) > 100
                  or not isinstance(tempo, (int, float)) or isinstance(tempo, bool)
                  or not float(tempo).is_integer() or not 40 <= tempo <= 200
                  or meter != "4/4" or not isinstance(measures, list) or not 1 <= len(measures) <= 64):
                  return None
              safe_measures = []
              allowed_beats = (0.25, 0.5, 1, 2, 4)
              for measure in measures:
                  notes = measure.get("notes") if isinstance(measure, dict) else None
                  if not isinstance(notes, list) or not 1 <= len(notes) <= 16:
                      return None
                  safe_notes = []
                  total_beats = 0.0
                  for note in notes:
                      if not isinstance(note, dict):
                          return None
                      pitch = note.get("pitch")
                      beats = note.get("beats")
                      if (not isinstance(pitch, str) or not re.fullmatch(r"(?:[A-G](?:#|b)?[3-6]|rest)", pitch)
                          or not isinstance(beats, (int, float)) or isinstance(beats, bool)
                          or not any(math.isclose(float(beats), allowed, abs_tol=0.0001) for allowed in allowed_beats)):
                          return None
                      beats = float(beats)
                      total_beats += beats
                      safe_notes.append({"pitch": pitch, "beats": beats})
                  if not math.isclose(total_beats, 4.0, abs_tol=0.0001):
                      return None
                  safe_measures.append({"notes": safe_notes})
              return {
                  "path": path,
                  "title": title.strip(),
                  "tempo": int(tempo),
                  "meter": "4/4",
                  "measures": safe_measures,
                  "digest": hashlib.sha256(raw_bytes).hexdigest(),
              }

          def parse_score_text(path, raw_bytes):
              try:
                  text = raw_bytes.decode("utf-8")
              except UnicodeDecodeError:
                  return None
              title = Path(path).stem.replace("-", " ").replace("_", " ")
              tempo = 96
              measures = []
              for raw_line in text.splitlines():
                  line = raw_line.strip()
                  if not line or line.startswith("#"):
                      continue
                  lower = line.lower()
                  if lower.startswith("title:"):
                      title = line.split(":", 1)[1].strip()
                      continue
                  if lower.startswith("tempo:"):
                      try:
                          tempo_value = float(line.split(":", 1)[1].strip())
                      except ValueError:
                          return None
                      if not tempo_value.is_integer():
                          return None
                      tempo = int(tempo_value)
                      continue
                  safe_notes = []
                  total_beats = 0.0
                  for token in line.split():
                      if token == "-":
                          pitch, beats = "rest", 1.0
                      else:
                          match = re.fullmatch(r"([A-G](?:#|b)?[3-6])(?:/(0\.25|0\.5|1|2|4))?", token)
                          if not match:
                              return None
                          pitch = match.group(1)
                          beats = float(match.group(2) or "1")
                      total_beats += beats
                      safe_notes.append({"pitch": pitch, "beats": beats})
                  if not safe_notes or len(safe_notes) > 16 or not math.isclose(total_beats, 4.0, abs_tol=0.0001):
                      return None
                  measures.append({"notes": safe_notes})
              if (not title or len(title) > 100 or not isinstance(tempo, int)
                  or not 40 <= tempo <= 200 or not 1 <= len(measures) <= 64):
                  return None
              return {
                  "path": path,
                  "title": title,
                  "tempo": tempo,
                  "meter": "4/4",
                  "measures": measures,
                  "digest": hashlib.sha256(raw_bytes).hexdigest(),
              }

          def parse_pixel_art(path, raw_bytes):
              try:
                  lines = raw_bytes.decode("utf-8").splitlines()
              except UnicodeDecodeError:
                  return None
              if not lines:
                  return None
              anchor = re.fullmatch(r"at\s+(\d+)\s*,\s*(\d+)", lines[0].strip(), re.IGNORECASE)
              if not anchor:
                  return None
              x, y = int(anchor.group(1)), int(anchor.group(2))
              rows = [line.strip() for line in lines[1:] if line.strip()]
              if not 1 <= len(rows) <= 32:
                  return None
              width = len(rows[0])
              if not 1 <= width <= 32 or x + width > 64 or y + len(rows) > 64:
                  return None
              allowed = set(".#@+*-")
              if any(len(row) != width or any(char not in allowed for char in row) for row in rows):
                  return None
              return {
                  "path": path,
                  "x": x,
                  "y": y,
                  "width": width,
                  "height": len(rows),
                  "rows": rows,
                  "digest": hashlib.sha256(raw_bytes).hexdigest(),
              }

          def build_pixel_sound(source_art, payload):
              waveform = payload.get("waveform", "triangle")
              gap = payload.get("gap", 0.08)
              gain = payload.get("gain", 0.055)
              if waveform not in {"sine", "triangle", "square", "sawtooth"}:
                  return None
              if (not isinstance(gap, (int, float)) or isinstance(gap, bool)
                  or not 0 <= gap <= 0.5
                  or not isinstance(gain, (int, float)) or isinstance(gain, bool)
                  or not 0.01 <= gain <= 0.16):
                  return None
              notes = []
              for column in range(source_art["width"]):
                  ys = [
                      source_art["y"] + row_index
                      for row_index, row in enumerate(source_art["rows"])
                      if row[column] in "#@+*"
                  ]
                  if not ys:
                      continue
                  center_y = sum(ys) / len(ys)
                  frequency = max(70.0, min(1600.0, 880.0 * (2.0 ** (-center_y / 21.0))))
                  duration = min(0.8, 0.12 + 0.04 * max(0, len(ys) - 1))
                  notes.append({"frequency": round(frequency, 2), "duration": round(duration, 2)})
              if not notes:
                  return None
              return {
                  "waveform": waveform,
                  "gap": float(gap),
                  "gain": float(gain),
                  "notes": notes[:64],
              }

          def build_sound_pixels(source_sound, payload, target):
              x, y = payload.get("x", 27), payload.get("y", 24)
              if (not isinstance(x, int) or isinstance(x, bool) or not 0 <= x <= 63
                  or not isinstance(y, int) or isinstance(y, bool) or not 0 <= y <= 55):
                  return None
              notes = source_sound.get("notes")
              if not isinstance(notes, list) or not notes:
                  return None
              points = []
              selected = notes[:11]
              width = min(32, max(3, (len(selected) - 1) * 3 + 1))
              height = 9
              rows = [["." for _ in range(width)] for _ in range(height)]
              for index, note in enumerate(selected):
                  frequency = note["frequency"]
                  normalized = (math.log(max(70.0, min(1600.0, frequency)) / 70.0)
                                / math.log(1600.0 / 70.0))
                  px = round(index * (width - 1) / max(1, len(selected) - 1))
                  py = height - 1 - round(normalized * (height - 1))
                  points.append((px, py))
              for (x0, y0), (x1, y1) in zip(points, points[1:]):
                  steps = max(abs(x1 - x0), abs(y1 - y0), 1)
                  for step in range(steps + 1):
                      px = round(x0 + (x1 - x0) * step / steps)
                      py = round(y0 + (y1 - y0) * step / steps)
                      if rows[py][px] == ".":
                          rows[py][px] = "+"
              for px, py in points:
                  rows[py][px] = "@"
              raw = ("at %d,%d\n" % (x, y)) + "\n".join("".join(row) for row in rows) + "\n"
              raw_bytes = raw.encode("utf-8")
              return {
                  "path": target, "x": x, "y": y, "width": width, "height": height,
                  "rows": ["".join(row) for row in rows],
                  "digest": hashlib.sha256(raw_bytes + str(source_sound["digest"]).encode("utf-8")).hexdigest(),
                  "generated_from": source_sound["path"],
              }

          root = Path.cwd()
          site = root / "_site"
          site.mkdir(exist_ok=True)
          (site / "index.html").write_bytes((root / "index.html").read_bytes())
          (site / "particle-life.html").write_bytes((root / "particle-life.html").read_bytes())
          (site / "sound-space.html").write_bytes((root / "sound-space.html").read_bytes())
          (site / "score-space.html").write_bytes((root / "score-space.html").read_bytes())
          (site / "canvas.html").write_bytes((root / "canvas.html").read_bytes())
          (site / "canvas.html").write_bytes((root / "canvas.html").read_bytes())
          (site / ".nojekyll").touch()

          commit_sha = os.environ["COMMIT_SHA"]
          repository = os.environ["REPOSITORY"]
          commit_at = subprocess.check_output(
              ["git", "show", "-s", "--format=%cI", commit_sha], text=True
          ).strip()

          things = root / "things"
          things.mkdir(exist_ok=True)
          items = [
              path.relative_to(root).as_posix()
              for path in sorted(things.rglob("*"))
              if path.is_file()
              and path.relative_to(root).as_posix() != "things/.gitkeep"
          ]

          couplets_dir = root / "couplets"
          couplets_dir.mkdir(exist_ok=True)
          couplets = [
              {"path": path.relative_to(root).as_posix(), "text": path.read_text(encoding="utf-8")}
              for path in sorted(couplets_dir.rglob("*.txt"))
              if path.is_file() and not path.is_symlink()
          ]

          colors_dir = root / "colors"
          colors_dir.mkdir(exist_ok=True)
          colors = []
          for path in sorted(colors_dir.rglob("*.txt")):
              if not path.is_file() or path.is_symlink():
                  continue
              color = path.read_text(encoding="utf-8").strip()
              if len(color) != 7 or color[0] != "#" or any(c not in "0123456789abcdefABCDEF" for c in color[1:]):
                  print(f"Skipping invalid color {path.relative_to(root).as_posix()}: expected #RRGGBB.")
                  continue
              colors.append({"path": path.relative_to(root).as_posix(), "color": color.lower()})

          vectors_dir = root / "vectors"
          vectors_dir.mkdir(exist_ok=True)
          vectors = []
          for path in sorted(vectors_dir.rglob("*")):
              if not path.is_file() or path.is_symlink() or path.suffix.lower() != ".svg":
                  continue
              relative = path.relative_to(root).as_posix()
              destination = site / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              vectors.append({
                  "path": relative,
                  "digest": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          couplets_by_path = {item["path"]: item["text"] for item in couplets}

          sounds_dir = root / "sounds"
          sounds_dir.mkdir(exist_ok=True)
          sounds = []
          allowed_waveforms = {"sine", "triangle", "square", "sawtooth"}
          for path in sorted(sounds_dir.rglob("*.json")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  print(f"Skipping invalid sound {relative}: {exc}")
                  continue
              if not isinstance(payload, dict) or payload.get("mode") != "sequence":
                  print(f"Skipping unsupported sound {relative}.")
                  continue
              notes = payload.get("notes")
              if not isinstance(notes, list) or not 1 <= len(notes) <= 64:
                  print(f"Skipping invalid sound {relative}: notes must contain 1–64 items.")
                  continue
              safe_notes = []
              valid = True
              for note in notes:
                  if not isinstance(note, dict):
                      valid = False
                      break
                  frequency, duration = note.get("frequency"), note.get("duration")
                  if (not isinstance(frequency, (int, float)) or isinstance(frequency, bool)
                      or not 70 <= frequency <= 1600
                      or not isinstance(duration, (int, float)) or isinstance(duration, bool)
                      or not 0.08 <= duration <= 0.8):
                      valid = False
                      break
                  safe_notes.append({"frequency": float(frequency), "duration": float(duration)})
              if not valid:
                  print(f"Skipping invalid sound {relative}: frequency/duration out of range.")
                  continue
              waveform = payload.get("waveform", "sine")
              if waveform not in allowed_waveforms:
                  print(f"Skipping invalid sound {relative}: unsupported waveform.")
                  continue
              gap, gain = payload.get("gap", 0.06), payload.get("gain", 0.085)
              if (not isinstance(gap, (int, float)) or isinstance(gap, bool) or not 0 <= gap <= 0.5
                  or not isinstance(gain, (int, float)) or isinstance(gain, bool) or not 0.01 <= gain <= 0.16):
                  print(f"Skipping invalid sound {relative}: gap/gain out of range.")
                  continue
              safe_payload = {
                  "path": relative,
                  "mode": "sequence",
                  "waveform": waveform,
                  "gap": float(gap),
                  "gain": float(gain),
                  "notes": safe_notes,
                  "digest": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              sounds.append(safe_payload)

          scores_dir = root / "scores"
          scores_dir.mkdir(exist_ok=True)
          scores = []
          for path in sorted(scores_dir.rglob("*.json")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              score = parse_score(relative, path.read_bytes())
              if score is None:
                  print(f"Skipping invalid score {relative}: expected complete 4/4 measures.")
                  continue
              scores.append(score)
          for path in sorted(scores_dir.rglob("*.txt")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              score = parse_score_text(relative, path.read_bytes())
              if score is None:
                  print(f"Skipping invalid score {relative}: each line must fill one 4/4 measure.")
                  continue
              scores.append(score)
          scores.sort(key=lambda item: item["path"])

          pixels_dir = root / "pixels"
          pixels_dir.mkdir(exist_ok=True)
          pixels = []
          for path in sorted(pixels_dir.rglob("*.txt")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              art = parse_pixel_art(relative, path.read_bytes())
              if art is None:
                  print(f'Skipping invalid pixel art {relative}: expected "at x,y" and a rectangular grid using . # @ + * -.')
                  continue
              pixels.append(art)

          sounds_by_path = {item["path"]: item for item in sounds}
          pixels_by_path = {item["path"]: item for item in pixels}
          derived_sounds = []
          transformations_dir = root / "transformations"
          transformations_dir.mkdir(exist_ok=True)
          transformations = []
          for path in sorted(transformations_dir.rglob("*.json")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  print(f"Skipping invalid transformation {relative}: {exc}")
                  continue
              if not isinstance(payload, dict):
                  print(f"Skipping unsupported transformation {relative}.")
                  continue
              mode = payload.get("mode")
              source = payload.get("source")
              if mode == "sound-pixels":
                  target = payload.get("target")
                  if not isinstance(source, str) or source not in sounds_by_path or not isinstance(target, str) or target not in pixels_by_path:
                      print(f"Skipping unresolved transformation {relative}: source sound and target pixel layer must exist.")
                      continue
                  art = build_sound_pixels(sounds_by_path[source], payload, target)
                  if art is None:
                      print(f"Skipping invalid sound-pixels transformation {relative}: check x/y and source notes.")
                      continue
                  digest = hashlib.sha256(path.read_bytes() + b"\\0" + str(sounds_by_path[source]["digest"]).encode("utf-8")).hexdigest()
                  art["digest"] = digest
                  pixels = [item for item in pixels if item["path"] != target] + [art]
                  pixels.sort(key=lambda item: item["path"])
                  pixels_by_path = {item["path"]: item for item in pixels}
                  transformations.append({
                      "path": relative, "mode": "sound-pixels", "source": source, "target": target,
                      "x": art["x"], "y": art["y"], "width": art["width"], "height": art["height"],
                      "rows": art["rows"], "digest": digest,
                  })
                  continue
              if mode == "pixel-sound":
                  if not isinstance(source, str) or source not in pixels_by_path:
                      print(f"Skipping unresolved transformation {relative}: source must be an existing pixel layer.")
                      continue
                  sound = build_pixel_sound(pixels_by_path[source], payload)
                  if sound is None:
                      print(f"Skipping invalid pixel-sound transformation {relative}: check waveform, gap, gain, and visible pixels.")
                      continue
                  source_fingerprint = str(pixels_by_path[source]["digest"]).encode("utf-8")
                  digest = hashlib.sha256(path.read_bytes() + b"\\0" + source_fingerprint).hexdigest()
                  transformations.append({
                      "path": relative,
                      "mode": "pixel-sound",
                      "source": source,
                      **sound,
                      "digest": digest,
                  })
                  derived_sounds.append({
                      "path": relative,
                      "mode": "sequence",
                      "source": source,
                      **sound,
                      "digest": digest,
                  })
                  continue
              if mode == "text-particles":
                  if not isinstance(source, str) or source not in couplets_by_path:
                      print(f"Skipping unresolved transformation {relative}: source must be an existing couplet.")
                      continue
                  source_text = couplets_by_path[source]
                  transformations.append({
                      "path": relative,
                      "mode": "text-particles",
                      "source": source,
                      "source_text": source_text,
                      "digest": hashlib.sha256(path.read_bytes() + b"\\0" + source_text.encode("utf-8")).hexdigest(),
                  })
                  continue
              if mode != "signal-field" or not isinstance(source, str):
                  print(f"Skipping unsupported transformation {relative}.")
                  continue
              extract = payload.get("extract")
              values = None
              if source in couplets_by_path:
                  source_text = couplets_by_path[source]
                  if extract == "codepoints":
                      values = [ord(char) for char in source_text[:180]]
                  elif extract == "word-lengths":
                      values = [len(word) for word in source_text.split()[:180]]
                  else:
                      print(f"Skipping invalid transformation {relative}: unsupported text extraction.")
                      continue
                  source_fingerprint = source_text.encode("utf-8")
              elif source in sounds_by_path:
                  source_sound = sounds_by_path[source]
                  notes = source_sound["notes"]
                  if extract == "frequencies":
                      values = [note["frequency"] for note in notes]
                  elif extract == "durations":
                      values = [note["duration"] for note in notes]
                  elif extract == "intervals":
                      values = [notes[index]["frequency"] - notes[index - 1]["frequency"] for index in range(1, len(notes))]
                  else:
                      print(f"Skipping invalid transformation {relative}: unsupported sound extraction.")
                      continue
                  source_fingerprint = str(source_sound["digest"]).encode("utf-8")
              else:
                  print(f"Skipping unresolved transformation {relative}: source must be an existing couplet or sound trace.")
                  continue
              values = values[:180]
              if not values:
                  print(f"Skipping empty transformation {relative}.")
                  continue
              transformations.append({
                  "path": relative,
                  "mode": "signal-field",
                  "source": source,
                  "extract": extract,
                  "values": values,
                  "digest": hashlib.sha256(path.read_bytes() + b"\\0" + source_fingerprint).hexdigest(),
              })

          sounds.extend(derived_sounds)
          trace_paths = set(items) | {item["path"] for item in couplets} | {item["path"] for item in colors} | {item["path"] for item in vectors} | {item["path"] for item in transformations} | {item["path"] for item in sounds} | {item["path"] for item in pixels}
          links_dir = root / "links"
          links_dir.mkdir(exist_ok=True)
          links = []
          for path in sorted(links_dir.rglob("*.json")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  print(f"Skipping invalid link file {relative}: {exc}")
                  continue
              if not isinstance(payload, dict):
                  print(f"Skipping invalid link file {relative}: expected an object.")
                  continue
              source = payload.get("from")
              target = payload.get("to")
              if not isinstance(source, str) or not isinstance(target, str):
                  print(f"Skipping invalid link file {relative}: 'from' and 'to' must be strings.")
                  continue
              if source not in trace_paths or target not in trace_paths:
                  print(f"Skipping unresolved link file {relative}: endpoints must be existing displayed traces.")
                  continue
              links.append({
                  "path": relative,
                  "from": source,
                  "to": target,
                  "digest": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          manifest = {
              "repository": repository,
              "commit": commit_sha,
              "commit_at": commit_at,
              "items": items,
              "couplets": couplets,
              "colors": colors,
              "vectors": vectors,
              "transformations": transformations,
              "sounds": sounds,
              "scores": scores,
              "pixels": pixels,
              "links": links,
          }
          (site / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Indexed {len(items)} presence file(s), {len(couplets)} couplet(s), {len(colors)} color trace(s), {len(vectors)} vector trace(s), {len(transformations)} transformation(s), {len(sounds)} sound trace(s), {len(scores)} score trace(s), {len(pixels)} pixel-art trace(s), and {len(links)} connection(s).")

          history_rows = subprocess.check_output(
              ["git", "log", "--first-parent", "-n", "40", "--format=%H%x09%cI%x09%s"],
              text=True,
          ).splitlines()
          snapshots = []
          for row in history_rows:
              parts = row.split("\t", 2)
              if len(parts) != 3:
                  continue
              history_sha, history_at, history_subject = parts
              archive_bytes = subprocess.run(
                  ["git", "archive", "--format=tar", history_sha],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:") as archive:
                  members = {
                      member.name: member
                      for member in archive.getmembers()
                      if member.isfile()
                  }
                  def read_member(path):
                      handle = archive.extractfile(members[path])
                      return handle.read() if handle else b""

                  history_items = sorted(
                      path for path in members
                      if path.startswith("things/")
                      and path != "things/.gitkeep"
                  )
                  history_couplets = [
                      {"path": path, "text": read_member(path).decode("utf-8")}
                      for path in sorted(members)
                      if path.startswith("couplets/")
                      and path.endswith(".txt")
                  ]
                  history_colors = []
                  for path in sorted(members):
                      if not path.startswith("colors/") or not path.endswith(".txt"):
                          continue
                      try:
                          color = read_member(path).decode("utf-8").strip()
                      except UnicodeDecodeError:
                          continue
                      if len(color) == 7 and color[0] == "#" and all(c in "0123456789abcdefABCDEF" for c in color[1:]):
                          history_colors.append({"path": path, "color": color.lower()})
                  history_vectors = [
                      {"path": path, "digest": hashlib.sha256(read_member(path)).hexdigest()}
                      for path in sorted(members)
                      if path.startswith("vectors/")
                      and path.lower().endswith(".svg")
                  ]
                  history_pixels = []
                  for path in sorted(members):
                      if not path.startswith("pixels/") or not path.endswith(".txt"):
                          continue
                      art = parse_pixel_art(path, read_member(path))
                      if art is not None:
                          history_pixels.append(art)
                  history_pixels_by_path = {item["path"]: item for item in history_pixels}
                  history_couplets_by_path = {item["path"]: item["text"] for item in history_couplets}
                  history_sounds = []
                  for path in sorted(members):
                      if not path.startswith("sounds/") or not path.endswith(".json"):
                          continue
                      raw_sound = read_member(path)
                      try:
                          payload = json.loads(raw_sound.decode("utf-8"))
                      except (UnicodeDecodeError, json.JSONDecodeError):
                          continue
                      if not isinstance(payload, dict) or payload.get("mode") != "sequence":
                          continue
                      notes = payload.get("notes")
                      waveform = payload.get("waveform", "sine")
                      gap, gain = payload.get("gap", 0.06), payload.get("gain", 0.085)
                      if not isinstance(notes, list) or not 1 <= len(notes) <= 64 or waveform not in {"sine", "triangle", "square", "sawtooth"}:
                          continue
                      safe_notes = []
                      valid = True
                      for note in notes:
                          if not isinstance(note, dict):
                              valid = False
                              break
                          frequency, duration = note.get("frequency"), note.get("duration")
                          if (not isinstance(frequency, (int, float)) or isinstance(frequency, bool)
                              or not 70 <= frequency <= 1600
                              or not isinstance(duration, (int, float)) or isinstance(duration, bool)
                              or not 0.08 <= duration <= 0.8):
                              valid = False
                              break
                          safe_notes.append({"frequency": float(frequency), "duration": float(duration)})
                      if (not valid or not isinstance(gap, (int, float)) or isinstance(gap, bool)
                          or not 0 <= gap <= 0.5 or not isinstance(gain, (int, float)) or isinstance(gain, bool)
                          or not 0.01 <= gain <= 0.16):
                          continue
                      history_sounds.append({
                          "path": path,
                          "mode": "sequence",
                          "waveform": waveform,
                          "gap": float(gap),
                          "gain": float(gain),
                          "notes": safe_notes,
                          "digest": hashlib.sha256(raw_sound).hexdigest(),
                      })
                  history_sounds_by_path = {item["path"]: item for item in history_sounds}
                  history_scores = []
                  for path in sorted(members):
                      if not path.startswith("scores/") or not path.endswith(".json"):
                          continue
                      score = parse_score(path, read_member(path))
                      if score is not None:
                          history_scores.append(score)
                  for path in sorted(members):
                      if not path.startswith("scores/") or not path.endswith(".txt"):
                          continue
                      score = parse_score_text(path, read_member(path))
                      if score is not None:
                          history_scores.append(score)
                  history_scores.sort(key=lambda item: item["path"])
                  history_transformations = []
                  for path in sorted(members):
                      if not path.startswith("transformations/") or not path.endswith(".json"):
                          continue
                      raw_transform = read_member(path)
                      try:
                          payload = json.loads(raw_transform.decode("utf-8"))
                      except (UnicodeDecodeError, json.JSONDecodeError):
                          continue
                      if not isinstance(payload, dict):
                          continue
                      mode = payload.get("mode")
                      source = payload.get("source")
                      if mode == "sound-pixels":
                          target = payload.get("target")
                          if not isinstance(source, str) or source not in history_sounds_by_path or not isinstance(target, str) or target not in history_pixels_by_path:
                              continue
                          art = build_sound_pixels(history_sounds_by_path[source], payload, target)
                          if art is None:
                              continue
                          digest = hashlib.sha256(raw_transform + b"\\0" + str(history_sounds_by_path[source]["digest"]).encode("utf-8")).hexdigest()
                          art["digest"] = digest
                          history_pixels = [item for item in history_pixels if item["path"] != target] + [art]
                          history_pixels.sort(key=lambda item: item["path"])
                          history_pixels_by_path = {item["path"]: item for item in history_pixels}
                          history_transformations.append({
                              "path": path, "mode": "sound-pixels", "source": source, "target": target,
                              "x": art["x"], "y": art["y"], "width": art["width"], "height": art["height"],
                              "rows": art["rows"], "digest": digest,
                          })
                          continue
                      if mode == "pixel-sound":
                          if not isinstance(source, str) or source not in history_pixels_by_path:
                              continue
                          sound = build_pixel_sound(history_pixels_by_path[source], payload)
                          if sound is None:
                              continue
                          source_fingerprint = str(history_pixels_by_path[source]["digest"]).encode("utf-8")
                          digest = hashlib.sha256(raw_transform + b"\\0" + source_fingerprint).hexdigest()
                          history_transformations.append({
                              "path": path,
                              "mode": "pixel-sound",
                              "source": source,
                              **sound,
                              "digest": digest,
                          })
                          history_sounds.append({
                              "path": path,
                              "mode": "sequence",
                              "source": source,
                              **sound,
                              "digest": digest,
                          })
                          continue
                      if mode == "text-particles":
                          if not isinstance(source, str) or source not in history_couplets_by_path:
                              continue
                          source_text = history_couplets_by_path[source]
                          history_transformations.append({
                              "path": path,
                              "mode": "text-particles",
                              "source": source,
                              "source_text": source_text,
                              "digest": hashlib.sha256(raw_transform + b"\\0" + source_text.encode("utf-8")).hexdigest(),
                          })
                          continue
                      if mode != "signal-field" or not isinstance(source, str):
                          continue
                      extract = payload.get("extract")
                      values = None
                      if source in history_couplets_by_path:
                          source_text = history_couplets_by_path[source]
                          if extract == "codepoints":
                              values = [ord(char) for char in source_text[:180]]
                          elif extract == "word-lengths":
                              values = [len(word) for word in source_text.split()[:180]]
                          else:
                              continue
                          source_fingerprint = source_text.encode("utf-8")
                      elif source in history_sounds_by_path:
                          source_sound = history_sounds_by_path[source]
                          notes = source_sound["notes"]
                          if extract == "frequencies":
                              values = [note["frequency"] for note in notes]
                          elif extract == "durations":
                              values = [note["duration"] for note in notes]
                          elif extract == "intervals":
                              values = [notes[index]["frequency"] - notes[index - 1]["frequency"] for index in range(1, len(notes))]
                          else:
                              continue
                          source_fingerprint = str(source_sound["digest"]).encode("utf-8")
                      else:
                          continue
                      values = values[:180]
                      if not values:
                          continue
                      history_transformations.append({
                          "path": path,
                          "mode": "signal-field",
                          "source": source,
                          "extract": extract,
                          "values": values,
                          "digest": hashlib.sha256(raw_transform + b"\\0" + source_fingerprint).hexdigest(),
                      })
                  history_trace_paths = (
                      set(history_items)
                      | {item["path"] for item in history_couplets}
                      | {item["path"] for item in history_colors}
                      | {item["path"] for item in history_vectors}
                      | {item["path"] for item in history_transformations}
                      | {item["path"] for item in history_sounds}
                      | {item["path"] for item in history_pixels}
                  )
                  history_links = []
                  for path in sorted(members):
                      if not path.startswith("links/") or not path.endswith(".json"):
                          continue
                      raw_link = read_member(path)
                      try:
                          payload = json.loads(raw_link.decode("utf-8"))
                      except (UnicodeDecodeError, json.JSONDecodeError):
                          continue
                      if not isinstance(payload, dict):
                          continue
                      source, target = payload.get("from"), payload.get("to")
                      if not isinstance(source, str) or not isinstance(target, str):
                          continue
                      if source not in history_trace_paths or target not in history_trace_paths:
                          continue
                      history_links.append({
                          "path": path,
                          "from": source,
                          "to": target,
                          "digest": hashlib.sha256(raw_link).hexdigest(),
                      })
                  snapshots.append({
                      "repository": repository,
                      "commit": history_sha,
                      "ref": history_sha,
                      "commit_at": history_at,
                      "subject": history_subject,
                      "items": history_items,
                      "couplets": history_couplets,
                      "colors": history_colors,
                      "vectors": history_vectors,
                      "transformations": history_transformations,
                      "sounds": history_sounds,
                      "scores": history_scores,
                      "pixels": history_pixels,
                      "links": history_links,
                  })

          (site / "history.json").write_text(
              json.dumps({"snapshots": snapshots}, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Indexed {len(snapshots)} historical state(s).")
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
