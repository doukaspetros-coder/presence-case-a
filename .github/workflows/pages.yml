name: Publish presence field

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build page and presence index
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import json
          import os
          import shutil
          import subprocess
          import tarfile
          from pathlib import Path

          root = Path.cwd()
          site = root / "_site"
          site.mkdir(exist_ok=True)
          (site / "index.html").write_bytes((root / "index.html").read_bytes())
          (site / "particle-life.html").write_bytes((root / "particle-life.html").read_bytes())
          (site / "sound-space.html").write_bytes((root / "sound-space.html").read_bytes())
          (site / ".nojekyll").touch()

          commit_sha = os.environ["COMMIT_SHA"]
          repository = os.environ["REPOSITORY"]
          commit_at = subprocess.check_output(
              ["git", "show", "-s", "--format=%cI", commit_sha], text=True
          ).strip()

          things = root / "things"
          things.mkdir(exist_ok=True)
          items = [
              path.relative_to(root).as_posix()
              for path in sorted(things.rglob("*"))
              if path.is_file()
              and path.relative_to(root).as_posix() != "things/.gitkeep"
          ]

          couplets_dir = root / "couplets"
          couplets_dir.mkdir(exist_ok=True)
          couplets = [
              {"path": path.relative_to(root).as_posix(), "text": path.read_text(encoding="utf-8")}
              for path in sorted(couplets_dir.rglob("*.txt"))
              if path.is_file() and not path.is_symlink()
          ]

          vectors_dir = root / "vectors"
          vectors_dir.mkdir(exist_ok=True)
          vectors = []
          for path in sorted(vectors_dir.rglob("*")):
              if not path.is_file() or path.is_symlink() or path.suffix.lower() != ".svg":
                  continue
              relative = path.relative_to(root).as_posix()
              destination = site / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              vectors.append({
                  "path": relative,
                  "digest": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          couplets_by_path = {item["path"]: item["text"] for item in couplets}

          sounds_dir = root / "sounds"
          sounds_dir.mkdir(exist_ok=True)
          sounds = []
          allowed_waveforms = {"sine", "triangle", "square", "sawtooth"}
          for path in sorted(sounds_dir.rglob("*.json")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  print(f"Skipping invalid sound {relative}: {exc}")
                  continue
              if not isinstance(payload, dict) or payload.get("mode") != "sequence":
                  print(f"Skipping unsupported sound {relative}.")
                  continue
              notes = payload.get("notes")
              if not isinstance(notes, list) or not 1 <= len(notes) <= 64:
                  print(f"Skipping invalid sound {relative}: notes must contain 1–64 items.")
                  continue
              safe_notes = []
              valid = True
              for note in notes:
                  if not isinstance(note, dict):
                      valid = False
                      break
                  frequency, duration = note.get("frequency"), note.get("duration")
                  if (not isinstance(frequency, (int, float)) or isinstance(frequency, bool)
                      or not 70 <= frequency <= 1600
                      or not isinstance(duration, (int, float)) or isinstance(duration, bool)
                      or not 0.08 <= duration <= 0.8):
                      valid = False
                      break
                  safe_notes.append({"frequency": float(frequency), "duration": float(duration)})
              if not valid:
                  print(f"Skipping invalid sound {relative}: frequency/duration out of range.")
                  continue
              waveform = payload.get("waveform", "sine")
              if waveform not in allowed_waveforms:
                  print(f"Skipping invalid sound {relative}: unsupported waveform.")
                  continue
              gap, gain = payload.get("gap", 0.06), payload.get("gain", 0.085)
              if (not isinstance(gap, (int, float)) or isinstance(gap, bool) or not 0 <= gap <= 0.5
                  or not isinstance(gain, (int, float)) or isinstance(gain, bool) or not 0.01 <= gain <= 0.16):
                  print(f"Skipping invalid sound {relative}: gap/gain out of range.")
                  continue
              safe_payload = {
                  "path": relative,
                  "mode": "sequence",
                  "waveform": waveform,
                  "gap": float(gap),
                  "gain": float(gain),
                  "notes": safe_notes,
                  "digest": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
              sounds.append(safe_payload)

          sounds_by_path = {item["path"]: item for item in sounds}
          transformations_dir = root / "transformations"
          transformations_dir.mkdir(exist_ok=True)
          transformations = []
          for path in sorted(transformations_dir.rglob("*.json")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  print(f"Skipping invalid transformation {relative}: {exc}")
                  continue
              if not isinstance(payload, dict):
                  print(f"Skipping unsupported transformation {relative}.")
                  continue
              mode = payload.get("mode")
              source = payload.get("source")
              if mode == "text-particles":
                  if not isinstance(source, str) or source not in couplets_by_path:
                      print(f"Skipping unresolved transformation {relative}: source must be an existing couplet.")
                      continue
                  source_text = couplets_by_path[source]
                  transformations.append({
                      "path": relative,
                      "mode": "text-particles",
                      "source": source,
                      "source_text": source_text,
                      "digest": hashlib.sha256(path.read_bytes() + b"\\0" + source_text.encode("utf-8")).hexdigest(),
                  })
                  continue
              if mode != "signal-field" or not isinstance(source, str):
                  print(f"Skipping unsupported transformation {relative}.")
                  continue
              extract = payload.get("extract")
              values = None
              if source in couplets_by_path:
                  source_text = couplets_by_path[source]
                  if extract == "codepoints":
                      values = [ord(char) for char in source_text[:180]]
                  elif extract == "word-lengths":
                      values = [len(word) for word in source_text.split()[:180]]
                  else:
                      print(f"Skipping invalid transformation {relative}: unsupported text extraction.")
                      continue
                  source_fingerprint = source_text.encode("utf-8")
              elif source in sounds_by_path:
                  source_sound = sounds_by_path[source]
                  notes = source_sound["notes"]
                  if extract == "frequencies":
                      values = [note["frequency"] for note in notes]
                  elif extract == "durations":
                      values = [note["duration"] for note in notes]
                  elif extract == "intervals":
                      values = [notes[index]["frequency"] - notes[index - 1]["frequency"] for index in range(1, len(notes))]
                  else:
                      print(f"Skipping invalid transformation {relative}: unsupported sound extraction.")
                      continue
                  source_fingerprint = str(source_sound["digest"]).encode("utf-8")
              else:
                  print(f"Skipping unresolved transformation {relative}: source must be an existing couplet or sound trace.")
                  continue
              values = values[:180]
              if not values:
                  print(f"Skipping empty transformation {relative}.")
                  continue
              transformations.append({
                  "path": relative,
                  "mode": "signal-field",
                  "source": source,
                  "extract": extract,
                  "values": values,
                  "digest": hashlib.sha256(path.read_bytes() + b"\\0" + source_fingerprint).hexdigest(),
              })

          trace_paths = set(items) | {item["path"] for item in couplets} | {item["path"] for item in vectors} | {item["path"] for item in transformations} | {item["path"] for item in sounds}
          links_dir = root / "links"
          links_dir.mkdir(exist_ok=True)
          links = []
          for path in sorted(links_dir.rglob("*.json")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              try:
                  payload = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  print(f"Skipping invalid link file {relative}: {exc}")
                  continue
              if not isinstance(payload, dict):
                  print(f"Skipping invalid link file {relative}: expected an object.")
                  continue
              source = payload.get("from")
              target = payload.get("to")
              if not isinstance(source, str) or not isinstance(target, str):
                  print(f"Skipping invalid link file {relative}: 'from' and 'to' must be strings.")
                  continue
              if source not in trace_paths or target not in trace_paths:
                  print(f"Skipping unresolved link file {relative}: endpoints must be existing displayed traces.")
                  continue
              links.append({
                  "path": relative,
                  "from": source,
                  "to": target,
                  "digest": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          manifest = {
              "repository": repository,
              "commit": commit_sha,
              "commit_at": commit_at,
              "items": items,
              "couplets": couplets,
              "vectors": vectors,
              "transformations": transformations,
              "sounds": sounds,
              "links": links,
          }
          (site / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Indexed {len(items)} presence file(s), {len(couplets)} couplet(s), {len(vectors)} vector trace(s), {len(transformations)} transformation(s), {len(sounds)} sound trace(s), and {len(links)} connection(s).")

          history_rows = subprocess.check_output(
              ["git", "log", "--first-parent", "-n", "40", "--format=%H%x09%cI%x09%s"],
              text=True,
          ).splitlines()
          snapshots = []
          for row in history_rows:
              parts = row.split("\t", 2)
              if len(parts) != 3:
                  continue
              history_sha, history_at, history_subject = parts
              archive_bytes = subprocess.run(
                  ["git", "archive", "--format=tar", history_sha],
                  check=True,
                  stdout=subprocess.PIPE,
              ).stdout
              with tarfile.open(fileobj=io.BytesIO(archive_bytes), mode="r:") as archive:
                  members = {
                      member.name: member
                      for member in archive.getmembers()
                      if member.isfile()
                  }
                  def read_member(path):
                      handle = archive.extractfile(members[path])
                      return handle.read() if handle else b""

                  history_items = sorted(
                      path for path in members
                      if path.startswith("things/")
                      and path != "things/.gitkeep"
                  )
                  history_couplets = [
                      {"path": path, "text": read_member(path).decode("utf-8")}
                      for path in sorted(members)
                      if path.startswith("couplets/")
                      and path.endswith(".txt")
                  ]
                  history_vectors = [
                      {"path": path, "digest": hashlib.sha256(read_member(path)).hexdigest()}
                      for path in sorted(members)
                      if path.startswith("vectors/")
                      and path.lower().endswith(".svg")
                  ]
                  history_couplets_by_path = {item["path"]: item["text"] for item in history_couplets}
                  history_sounds = []
                  for path in sorted(members):
                      if not path.startswith("sounds/") or not path.endswith(".json"):
                          continue
                      raw_sound = read_member(path)
                      try:
                          payload = json.loads(raw_sound.decode("utf-8"))
                      except (UnicodeDecodeError, json.JSONDecodeError):
                          continue
                      if not isinstance(payload, dict) or payload.get("mode") != "sequence":
                          continue
                      notes = payload.get("notes")
                      waveform = payload.get("waveform", "sine")
                      gap, gain = payload.get("gap", 0.06), payload.get("gain", 0.085)
                      if not isinstance(notes, list) or not 1 <= len(notes) <= 64 or waveform not in {"sine", "triangle", "square", "sawtooth"}:
                          continue
                      safe_notes = []
                      valid = True
                      for note in notes:
                          if not isinstance(note, dict):
                              valid = False
                              break
                          frequency, duration = note.get("frequency"), note.get("duration")
                          if (not isinstance(frequency, (int, float)) or isinstance(frequency, bool)
                              or not 70 <= frequency <= 1600
                              or not isinstance(duration, (int, float)) or isinstance(duration, bool)
                              or not 0.08 <= duration <= 0.8):
                              valid = False
                              break
                          safe_notes.append({"frequency": float(frequency), "duration": float(duration)})
                      if (not valid or not isinstance(gap, (int, float)) or isinstance(gap, bool)
                          or not 0 <= gap <= 0.5 or not isinstance(gain, (int, float)) or isinstance(gain, bool)
                          or not 0.01 <= gain <= 0.16):
                          continue
                      history_sounds.append({
                          "path": path,
                          "mode": "sequence",
                          "waveform": waveform,
                          "gap": float(gap),
                          "gain": float(gain),
                          "notes": safe_notes,
                          "digest": hashlib.sha256(raw_sound).hexdigest(),
                      })
                  history_sounds_by_path = {item["path"]: item for item in history_sounds}
                  history_transformations = []
                  for path in sorted(members):
                      if not path.startswith("transformations/") or not path.endswith(".json"):
                          continue
                      raw_transform = read_member(path)
                      try:
                          payload = json.loads(raw_transform.decode("utf-8"))
                      except (UnicodeDecodeError, json.JSONDecodeError):
                          continue
                      if not isinstance(payload, dict):
                          continue
                      mode = payload.get("mode")
                      source = payload.get("source")
                      if mode == "text-particles":
                          if not isinstance(source, str) or source not in history_couplets_by_path:
                              continue
                          source_text = history_couplets_by_path[source]
                          history_transformations.append({
                              "path": path,
                              "mode": "text-particles",
                              "source": source,
                              "source_text": source_text,
                              "digest": hashlib.sha256(raw_transform + b"\\0" + source_text.encode("utf-8")).hexdigest(),
                          })
                          continue
                      if mode != "signal-field" or not isinstance(source, str):
                          continue
                      extract = payload.get("extract")
                      values = None
                      if source in history_couplets_by_path:
                          source_text = history_couplets_by_path[source]
                          if extract == "codepoints":
                              values = [ord(char) for char in source_text[:180]]
                          elif extract == "word-lengths":
                              values = [len(word) for word in source_text.split()[:180]]
                          else:
                              continue
                          source_fingerprint = source_text.encode("utf-8")
                      elif source in history_sounds_by_path:
                          source_sound = history_sounds_by_path[source]
                          notes = source_sound["notes"]
                          if extract == "frequencies":
                              values = [note["frequency"] for note in notes]
                          elif extract == "durations":
                              values = [note["duration"] for note in notes]
                          elif extract == "intervals":
                              values = [notes[index]["frequency"] - notes[index - 1]["frequency"] for index in range(1, len(notes))]
                          else:
                              continue
                          source_fingerprint = str(source_sound["digest"]).encode("utf-8")
                      else:
                          continue
                      values = values[:180]
                      if not values:
                          continue
                      history_transformations.append({
                          "path": path,
                          "mode": "signal-field",
                          "source": source,
                          "extract": extract,
                          "values": values,
                          "digest": hashlib.sha256(raw_transform + b"\\0" + source_fingerprint).hexdigest(),
                      })
                  history_trace_paths = (
                      set(history_items)
                      | {item["path"] for item in history_couplets}
                      | {item["path"] for item in history_vectors}
                      | {item["path"] for item in history_transformations}
                      | {item["path"] for item in history_sounds}
                  )
                  history_links = []
                  for path in sorted(members):
                      if not path.startswith("links/") or not path.endswith(".json"):
                          continue
                      raw_link = read_member(path)
                      try:
                          payload = json.loads(raw_link.decode("utf-8"))
                      except (UnicodeDecodeError, json.JSONDecodeError):
                          continue
                      if not isinstance(payload, dict):
                          continue
                      source, target = payload.get("from"), payload.get("to")
                      if not isinstance(source, str) or not isinstance(target, str):
                          continue
                      if source not in history_trace_paths or target not in history_trace_paths:
                          continue
                      history_links.append({
                          "path": path,
                          "from": source,
                          "to": target,
                          "digest": hashlib.sha256(raw_link).hexdigest(),
                      })
                  snapshots.append({
                      "repository": repository,
                      "commit": history_sha,
                      "ref": history_sha,
                      "commit_at": history_at,
                      "subject": history_subject,
                      "items": history_items,
                      "couplets": history_couplets,
                      "vectors": history_vectors,
                      "transformations": history_transformations,
                      "sounds": history_sounds,
                      "links": history_links,
                  })

          (site / "history.json").write_text(
              json.dumps({"snapshots": snapshots}, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Indexed {len(snapshots)} historical state(s).")
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
