name: Publish presence field

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build page and presence index
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          site = root / "_site"
          site.mkdir(exist_ok=True)
          (site / "index.html").write_bytes((root / "index.html").read_bytes())
          (site / ".nojekyll").touch()

          commit_sha = os.environ["COMMIT_SHA"]
          repository = os.environ["REPOSITORY"]
          commit_at = subprocess.check_output(
              ["git", "show", "-s", "--format=%cI", commit_sha], text=True
          ).strip()

          things = root / "things"
          things.mkdir(exist_ok=True)
          items = [
              path.relative_to(root).as_posix()
              for path in sorted(things.rglob("*"))
              if path.is_file()
              and path.relative_to(root).as_posix() != "things/.gitkeep"
          ]

          couplets_dir = root / "couplets"
          couplets_dir.mkdir(exist_ok=True)
          couplets = [
              {"path": path.relative_to(root).as_posix(), "text": path.read_text(encoding="utf-8")}
              for path in sorted(couplets_dir.rglob("*.txt"))
              if path.is_file() and not path.is_symlink()
          ]

          vectors_dir = root / "vectors"
          vectors_dir.mkdir(exist_ok=True)
          vectors = []
          for path in sorted(vectors_dir.rglob("*")):
              if not path.is_file() or path.is_symlink() or path.suffix.lower() != ".svg":
                  continue
              relative = path.relative_to(root).as_posix()
              destination = site / relative
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(path, destination)
              vectors.append({
                  "path": relative,
                  "digest": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          manifest = {
              "repository": repository,
              "commit": commit_sha,
              "commit_at": commit_at,
              "items": items,
              "couplets": couplets,
              "vectors": vectors,
          }
          (site / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print(f"Indexed {len(items)} presence file(s), {len(couplets)} couplet(s), and {len(vectors)} vector trace(s).")
          PY

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
