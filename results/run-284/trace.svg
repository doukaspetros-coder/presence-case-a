<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" role="img" aria-labelledby="title desc">
<title id="title">Ring / South / 416</title>
<desc id="desc">A pixel ring and a descending southern trace share a field with two distinct frequency paths, 416 and a sequence beginning at 440.</desc>
<rect width="720" height="520" fill="#10141c"/>
<g fill="#9aabbe" font-family="monospace" font-size="12" letter-spacing="1">
  <text x="32" y="34">RING / SOUTH / 416</text>
  <text x="688" y="34" text-anchor="end">A TRACE, NOT A KEY</text>
</g>
<g transform="translate(70 76)" fill="#41607A">
  <rect x="40" y="0" width="20" height="20"/><rect x="60" y="0" width="20" height="20"/>
  <rect x="20" y="20" width="20" height="20"/><rect x="40" y="20" width="20" height="20"/><rect x="80" y="20" width="20" height="20"/><rect x="100" y="20" width="20" height="20"/>
  <rect x="0" y="40" width="20" height="20"/><rect x="120" y="40" width="20" height="20"/>
  <rect x="0" y="60" width="20" height="20"/><rect x="40" y="60" width="20" height="20"/><rect x="60" y="60" width="20" height="20"/><rect x="80" y="60" width="20" height="20"/><rect x="120" y="60" width="20" height="20"/>
  <rect x="0" y="80" width="20" height="20"/><rect x="40" y="80" width="20" height="20"/><rect x="60" y="80" width="20" height="20"/><rect x="80" y="80" width="20" height="20"/><rect x="120" y="80" width="20" height="20"/>
  <rect x="20" y="100" width="20" height="20"/><rect x="40" y="100" width="20" height="20"/><rect x="80" y="100" width="20" height="20"/><rect x="100" y="100" width="20" height="20"/>
  <rect x="40" y="120" width="20" height="20"/><rect x="60" y="120" width="20" height="20"/>
</g>
<g transform="translate(270 92)" fill="#E4A9D2">
  <rect x="0" y="0" width="15" height="15"/><rect x="15" y="15" width="15" height="15"/><rect x="30" y="30" width="15" height="15"/><rect x="45" y="45" width="15" height="15"/><rect x="30" y="60" width="15" height="15"/><rect x="15" y="75" width="15" height="15"/>
</g>
<g stroke="#7eb8c9" stroke-width="1.2" fill="none" opacity=".8">
  <path d="M150 246 C210 280 260 258 300 280 S400 302 450 280"/>
  <path d="M150 300 C210 334 260 312 300 334 S400 356 450 334" stroke-dasharray="3 6"/>
</g>
<g fill="#9aabbe" font-family="monospace" font-size="12">
  <text x="70" y="274">PIXEL RING</text>
  <text x="270" y="204">SOUTH: DIAGONAL CELLS</text>
  <text x="70" y="376">TWO SOUND PATHS</text>
</g>
<g>
  <line x1="70" y1="402" x2="650" y2="402" stroke="#41607A" stroke-width="2"/>
  <line x1="70" y1="424" x2="650" y2="424" stroke="#E4A9D2" stroke-width="1.4"/>
  <g fill="#41607A">
    <circle cx="100" cy="402" r="4"/><circle cx="208" cy="402" r="4"/><circle cx="316" cy="402" r="4"/><circle cx="424" cy="402" r="4"/><circle cx="532" cy="402" r="4"/><circle cx="640" cy="402" r="4"/>
  </g>
  <g fill="#E4A9D2">
    <circle cx="100" cy="424" r="3"/><circle cx="164" cy="424" r="3"/><circle cx="228" cy="424" r="3"/><circle cx="292" cy="424" r="3"/><circle cx="356" cy="424" r="3"/><circle cx="420" cy="424" r="3"/><circle cx="484" cy="424" r="3"/><circle cx="548" cy="424" r="3"/><circle cx="612" cy="424" r="3"/>
  </g>
</g>
<g fill="#9aabbe" font-family="monospace" font-size="12">
  <text x="70" y="394">416 Hz · SINE · LONGER SECOND EVENT</text>
  <text x="650" y="446" text-anchor="end">440 → 523.25 → 659.25 → 523.25 …</text>
  <text x="70" y="486">The connection joins the sequences; the drawing does not claim they share a cause.</text>
</g>
</svg>