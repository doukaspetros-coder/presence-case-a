<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Ring / southward remainder</title>
<desc id="desc">A self-contained visual score translating the supplied ring pixel pattern into a pulse field, with the separate southward diagonal retained beneath it. Two nearby frequency marks show 415.3 and 416 without treating them as identical.</desc>
<rect width="900" height="520" fill="#10141c"/>
<g fill="#d9e2ec" font-family="monospace">
  <text x="42" y="42" font-size="15" letter-spacing="2">RING / SOUTHWARD REMAINDER</text>
  <text x="42" y="66" font-size="11" fill="#7f94aa">* outer mark · + inner mark · . silence</text>
</g>
<g transform="translate(70 104)">
  <rect x="-12" y="-12" width="224" height="224" rx="4" fill="#18212d" stroke="#344457"/>
  <rect x="80" y="0" width="14" height="14" rx="2" fill="#41607A"/><rect x="100" y="0" width="14" height="14" rx="2" fill="#41607A"/><rect x="40" y="20" width="14" height="14" rx="2" fill="#41607A"/><rect x="60" y="20" width="14" height="14" rx="2" fill="#41607A"/><rect x="120" y="20" width="14" height="14" rx="2" fill="#41607A"/><rect x="140" y="20" width="14" height="14" rx="2" fill="#41607A"/><rect x="20" y="40" width="14" height="14" rx="2" fill="#41607A"/><rect x="160" y="40" width="14" height="14" rx="2" fill="#41607A"/><rect x="0" y="60" width="14" height="14" rx="2" fill="#41607A"/><rect x="80" y="60" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="100" y="60" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="120" y="60" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="140" y="60" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="180" y="60" width="14" height="14" rx="2" fill="#41607A"/><rect x="0" y="80" width="14" height="14" rx="2" fill="#41607A"/><rect x="60" y="80" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="80" y="80" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="100" y="80" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="120" y="80" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="140" y="80" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="180" y="80" width="14" height="14" rx="2" fill="#41607A"/><rect x="20" y="100" width="14" height="14" rx="2" fill="#41607A"/><rect x="60" y="100" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="80" y="100" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="100" y="100" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="120" y="100" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="140" y="100" width="14" height="14" rx="2" fill="#E4A9D2"/><rect x="160" y="100" width="14" height="14" rx="2" fill="#41607A"/><rect x="40" y="120" width="14" height="14" rx="2" fill="#41607A"/><rect x="60" y="120" width="14" height="14" rx="2" fill="#41607A"/><rect x="120" y="120" width="14" height="14" rx="2" fill="#41607A"/><rect x="140" y="120" width="14" height="14" rx="2" fill="#41607A"/><rect x="80" y="140" width="14" height="14" rx="2" fill="#41607A"/><rect x="100" y="140" width="14" height="14" rx="2" fill="#41607A"/>
</g>
<g transform="translate(360 116)" font-family="monospace">
  <text x="0" y="0" fill="#9aabbe" font-size="12">ROW → PULSE COUNT</text>
  <text x="0" y="32" fill="#7f94aa" font-size="11">01</text><line x1="38" y1="28" x2="340" y2="28" stroke="#283747"/><text x="48" y="32" fill="#41607A" font-size="13">● ● </text><text x="180" y="32" fill="#E4A9D2" font-size="13"></text><text x="0" y="61" fill="#7f94aa" font-size="11">02</text><line x1="38" y1="57" x2="340" y2="57" stroke="#283747"/><text x="48" y="61" fill="#41607A" font-size="13">● ● ● ● </text><text x="180" y="61" fill="#E4A9D2" font-size="13"></text><text x="0" y="90" fill="#7f94aa" font-size="11">03</text><line x1="38" y1="86" x2="340" y2="86" stroke="#283747"/><text x="48" y="90" fill="#41607A" font-size="13">● ● </text><text x="180" y="90" fill="#E4A9D2" font-size="13"></text><text x="0" y="119" fill="#7f94aa" font-size="11">04</text><line x1="38" y1="115" x2="340" y2="115" stroke="#283747"/><text x="48" y="119" fill="#41607A" font-size="13">● ● </text><text x="180" y="119" fill="#E4A9D2" font-size="13">◆ ◆ ◆ ◆ </text><text x="0" y="148" fill="#7f94aa" font-size="11">05</text><line x1="38" y1="144" x2="340" y2="144" stroke="#283747"/><text x="48" y="148" fill="#41607A" font-size="13">● ● </text><text x="180" y="148" fill="#E4A9D2" font-size="13">◆ ◆ ◆ ◆ ◆ </text><text x="0" y="177" fill="#7f94aa" font-size="11">06</text><line x1="38" y1="173" x2="340" y2="173" stroke="#283747"/><text x="48" y="177" fill="#41607A" font-size="13">● ● </text><text x="180" y="177" fill="#E4A9D2" font-size="13">◆ ◆ ◆ ◆ ◆ </text><text x="0" y="206" fill="#7f94aa" font-size="11">07</text><line x1="38" y1="202" x2="340" y2="202" stroke="#283747"/><text x="48" y="206" fill="#41607A" font-size="13">● ● ● ● </text><text x="180" y="206" fill="#E4A9D2" font-size="13"></text><text x="0" y="235" fill="#7f94aa" font-size="11">08</text><line x1="38" y1="231" x2="340" y2="231" stroke="#283747"/><text x="48" y="235" fill="#41607A" font-size="13">● ● </text><text x="180" y="235" fill="#E4A9D2" font-size="13"></text>
  <text x="0" y="285" fill="#41607A" font-size="11">● outer cells</text>
  <text x="160" y="285" fill="#E4A9D2" font-size="11">◆ inner cells</text>
</g>
<g transform="translate(72 344)">
  <text x="0" y="0" fill="#9aabbe" font-family="monospace" font-size="12">SOUTH / A DIFFERENT TRACE</text>
  <rect x="0" y="20" width="15" height="15" rx="2" fill="#7eb8c9"/><rect x="22" y="42" width="15" height="15" rx="2" fill="#7eb8c9"/><rect x="44" y="64" width="15" height="15" rx="2" fill="#7eb8c9"/><rect x="66" y="86" width="15" height="15" rx="2" fill="#7eb8c9"/><rect x="44" y="108" width="15" height="15" rx="2" fill="#7eb8c9"/><rect x="22" y="130" width="15" height="15" rx="2" fill="#7eb8c9"/><rect x="44" y="130" width="15" height="15" rx="2" fill="#E4A9D2"/>
  <path d="M 118 36 C 150 55, 164 72, 190 108" fill="none" stroke="#7eb8c9" stroke-width="1.2" stroke-dasharray="3 5"/>
  <text x="240" y="42" fill="#7f94aa" font-family="monospace" font-size="11">separate diagonal;</text>
  <text x="240" y="60" fill="#7f94aa" font-family="monospace" font-size="11">not forced into the ring</text>
</g>
<g transform="translate(570 368)" font-family="monospace">
  <text x="0" y="0" fill="#9aabbe" font-size="12">NEAR, NOT EQUAL</text>
  <line x1="0" y1="32" x2="265" y2="32" stroke="#344457"/>
  <line x1="110" y1="20" x2="110" y2="46" stroke="#E4A9D2" stroke-width="2"/>
  <line x1="145" y1="20" x2="145" y2="46" stroke="#41607A" stroke-width="2"/>
  <text x="96" y="62" fill="#E4A9D2" font-size="12">415.3</text>
  <text x="145" y="82" fill="#41607A" font-size="12">416</text>
  <text x="0" y="112" fill="#7f94aa" font-size="10">Ab4 ≈ 415.3 Hz in score;</text>
  <text x="0" y="128" fill="#7f94aa" font-size="10">sequence retains 416 Hz.</text>
</g>
<text x="42" y="494" fill="#52677c" font-family="monospace" font-size="10">A reading made here: rows become pulses; the southern diagonal remains apart.</text>
</svg>