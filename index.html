<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title></title>
<style>
:root{color-scheme:dark;--ink:#e8edf4;--muted:#7f899a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a10}
body{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:radial-gradient(ellipse at 50% 44%,rgba(37,48,71,.42),transparent 57%),#080a10}
#field{position:absolute;inset:0;overflow:hidden}
#field:before{content:"";position:absolute;inset:-20%;pointer-events:none;opacity:.22;background-image:radial-gradient(rgba(184,199,219,.22) .7px,transparent .8px);background-size:31px 31px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%);animation:drift 100s linear infinite}
.presence{--x:50%;--y:50%;position:absolute;left:var(--x);top:var(--y);z-index:1;display:block;width:8px;height:8px;padding:0;transform:translate(-50%,-50%);border:0;border-radius:50%;background:rgba(218,232,255,.88);box-shadow:0 0 8px rgba(152,195,255,.72),0 0 25px rgba(91,153,226,.25);cursor:pointer;opacity:.9;animation:appear .75s ease-out both}
.presence:before,.presence:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(171,204,250,.32);border-radius:50%;animation:pulse 3.6s ease-out infinite}
.presence:after{animation-delay:1.8s}
.presence:focus-visible{outline:1px solid #fff;outline-offset:8px}
.presence:hover{background:#fff;box-shadow:0 0 12px rgba(190,218,255,.95),0 0 34px rgba(91,153,226,.4)}
.presence.is-new{animation:appear .75s ease-out both,glow 2.6s ease-out 1}
#readout{position:absolute;z-index:5;left:18px;bottom:16px;display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:10px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;user-select:none;pointer-events:none;opacity:.8}
.value{color:#d6e2f4;letter-spacing:.04em}
#state{position:absolute;z-index:5;right:18px;bottom:16px;display:flex;gap:7px;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
#state-mark{width:5px;height:5px;border-radius:50%;background:#8796a9}
#state[data-state="live"] #state-mark{background:#9fc9b1;box-shadow:0 0 9px rgba(159,201,177,.65)}
#state[data-state="error"] #state-mark{background:#d5a29a}
@keyframes pulse{0%{transform:scale(.65);opacity:.75}100%{transform:scale(3.1);opacity:0}}
@keyframes appear{from{opacity:0;scale:.35}to{opacity:.9;scale:1}}
@keyframes glow{0%{filter:brightness(2.8)}100%{filter:brightness(1)}}
@keyframes drift{to{transform:translate3d(31px,31px,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
@media(max-width:540px){#readout{left:10px;bottom:10px;gap:8px 12px;font-size:9px}#state{right:10px;bottom:10px;font-size:9px}}
</style>
</head>
<body>
<main id="field" aria-label="Shared space"></main>
<div id="readout" aria-live="off">
<span>PRESENCES <span class="value" id="count">0</span></span>
<span>NEW → SEEN <span class="value" id="latency">—</span></span>
<span>POLL <span class="value">3s</span></span>
</div>
<div id="state" data-state="wait"><span id="state-mark"></span><span id="state-text">WAITING</span></div>
<script>
(()=>{'use strict';
const POLL_MS=3000,field=document.getElementById('field'),countNode=document.getElementById('count'),latencyNode=document.getElementById('latency'),stateNode=document.getElementById('state'),stateText=document.getElementById('state-text');
const points=new Map(),markers=new Map();let known=new Set(),initialized=false,busy=false;
function hash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pointFor(id){if(!points.has(id))points.set(id,{x:7+(hash(id+':x')%8600)/100,y:9+(hash(id+':y')%8000)/100});return points.get(id)}
function setState(value,label){stateNode.dataset.state=value;stateText.textContent=label}
function render(ids,manifest,newIds){
const live=new Set(ids);
for(const entry of markers){const id=entry[0],el=entry[1];if(!live.has(id)){el.remove();markers.delete(id)}}
ids.forEach(id=>{if(typeof id!=='string'||!id)return;let el=markers.get(id);const isNew=newIds.has(id);
if(!el){el=document.createElement('a');el.className='presence';el.setAttribute('aria-label','Presence');el.title='Presence';el.rel='noopener noreferrer';
const repo=String(manifest.repository||''),commit=String(manifest.commit||''),path=id.split('/').map(encodeURIComponent).join('/');
if(/^[^/]+\/[^/]+$/.test(repo)&&/^[0-9a-f]{7,40}$/i.test(commit)){el.href='https://github.com/'+repo+'/blob/'+commit+'/'+path;el.target='_blank'}
const p=pointFor(id);el.style.setProperty('--x',p.x+'%');el.style.setProperty('--y',p.y+'%');field.appendChild(el);markers.set(id,el)}
if(isNew){el.classList.remove('is-new');void el.offsetWidth;el.classList.add('is-new')}
});
countNode.textContent=String(live.size);
}
async function poll(){if(busy)return;busy=true;try{
const url=new URL('./manifest.json',location.href);url.searchParams.set('_',String(Date.now()));
const response=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw Error('manifest '+response.status);
const manifest=await response.json();if(!manifest||!Array.isArray(manifest.items))throw Error('invalid manifest');
const ids=manifest.items.filter(id=>typeof id==='string'&&id.length>0),next=new Set(ids),fresh=new Set();
if(initialized){ids.forEach(id=>{if(!known.has(id)){fresh.add(id);const stamp=Date.parse(manifest.commit_at||'');if(Number.isFinite(stamp)){const seconds=Math.max(0,(Date.now()-stamp)/1000);latencyNode.textContent=seconds<10?seconds.toFixed(1)+'s':Math.round(seconds)+'s'}}})}
render(ids,manifest,fresh);known=next;initialized=true;setState('live','LIVE');
}catch(e){setState('error',initialized?'RETRYING':'WAITING')}finally{busy=false}}
poll();setInterval(poll,POLL_MS);
})();
</script>
</body>
</html>
