<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title></title>
<style>
:root{color-scheme:dark;--ink:#e8edf4;--muted:#7f899a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080a10}
body{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:radial-gradient(ellipse at 50% 44%,rgba(37,48,71,.42),transparent 57%),#080a10;overflow-x:hidden}
#field{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#connections{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
#field:before{content:"";position:absolute;inset:-20%;opacity:.22;background-image:radial-gradient(rgba(184,199,219,.22) .7px,transparent .8px);background-size:31px 31px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%);animation:drift 100s linear infinite}
.presence{--x:50%;--y:50%;position:absolute;left:var(--x);top:var(--y);z-index:1;display:block;width:7px;height:7px;padding:0;transform:translate(-50%,-50%);border:0;border-radius:50%;background:rgba(218,232,255,.88);box-shadow:0 0 8px rgba(152,195,255,.72),0 0 25px rgba(91,153,226,.25);cursor:pointer;opacity:.9;animation:appear .75s ease-out both;pointer-events:auto}
.presence:before,.presence:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(171,204,250,.32);border-radius:50%;animation:pulse 3.6s ease-out infinite}
.presence:after{animation-delay:1.8s}
.presence:hover{background:#fff;box-shadow:0 0 12px rgba(190,218,255,.95),0 0 34px rgba(91,153,226,.4)}
.is-new{animation:appear .75s ease-out both,glow 2.6s ease-out 1!important}
#board{position:relative;z-index:2;min-height:100svh;width:100%;padding:8vh 6vw 78px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:clamp(18px,3.6vw,56px);pointer-events:none}
.couplet{display:block;position:relative;max-width:min(520px,86vw);padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.1);background:rgba(13,17,27,.34);backdrop-filter:blur(4px);color:var(--ink);text-decoration:none;white-space:pre-line;font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,2.1vw,27px);line-height:1.65;letter-spacing:.015em;box-shadow:0 12px 50px rgba(0,0,0,.08);transition:background .3s,border-color .3s,transform .5s;pointer-events:auto;animation:appear 1.1s ease-out both}
.color-trace{display:flex;flex:0 0 84px;width:84px;height:84px;align-items:center;justify-content:center;position:relative;border:1px solid rgba(173,194,227,.2);background:rgba(13,17,27,.5);box-shadow:0 12px 35px rgba(0,0,0,.12);text-decoration:none;pointer-events:auto;animation:appear 1.1s ease-out both;transition:transform .3s,border-color .3s}
.color-swatch{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.28);box-shadow:0 0 20px color-mix(in srgb,var(--swatch) 24%,transparent);background:var(--swatch)}
.color-trace:hover,.color-trace:focus-visible{transform:scale(1.08);border-color:rgba(173,204,250,.5);outline:none}
.color-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.couplet:nth-child(3n+1){transform:rotate(-.7deg)}
.couplet:nth-child(3n+2){transform:rotate(.45deg);margin-top:2vh}
.couplet:nth-child(3n){transform:rotate(.9deg);margin-bottom:2vh}
.couplet:hover,.couplet:focus-visible{background:rgba(28,36,53,.64);border-color:rgba(173,204,250,.38);outline:none}
.couplet.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.vector-trace{display:flex;position:relative;flex:0 1 min(430px,86vw);align-items:center;justify-content:center;min-height:150px;max-height:58vh;padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.12);background:rgba(13,17,27,.42);box-shadow:0 12px 50px rgba(0,0,0,.1);text-decoration:none;pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.vector-trace img{display:block;width:100%;height:auto;max-width:100%;max-height:50vh;object-fit:contain}
.vector-trace:hover,.vector-trace:focus-visible{background:rgba(28,36,53,.64);border-color:rgba(173,204,250,.38);outline:none}
.vector-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.shared-canvas-trace{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;flex:0 1 min(420px,88vw);max-width:min(420px,88vw);min-width:min(250px,88vw);padding:clamp(12px,1.8vw,22px);border:1px solid rgba(173,194,227,.2);background:rgba(13,17,27,.6);box-shadow:0 12px 45px rgba(0,0,0,.16);text-decoration:none;pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.shared-canvas-head{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;color:var(--muted);font-size:9px;letter-spacing:.09em;overflow-wrap:anywhere}
.shared-canvas-label{color:#d6e2f4}
.shared-canvas-preview{display:block;width:100%;height:auto;aspect-ratio:1;image-rendering:pixelated;shape-rendering:crispEdges;background:#0a0e17;border:1px solid rgba(173,194,227,.12)}
.shared-canvas-trace:hover,.shared-canvas-trace:focus-visible{background:rgba(28,36,53,.72);border-color:rgba(173,204,250,.48);outline:none}
.shared-canvas-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.transform-trace{display:block;position:relative;flex:0 1 min(430px,86vw);max-width:min(430px,86vw);padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.12);background:rgba(13,17,27,.42);box-shadow:0 12px 50px rgba(0,0,0,.1);text-decoration:none;pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.transform-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:9px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.transform-kind{color:#d6e2f4}
.transform-source{max-width:100%;letter-spacing:.02em;text-transform:none;overflow-wrap:anywhere}
.particle-field{display:block;width:100%;height:auto;aspect-ratio:7/4;background:radial-gradient(ellipse at 50% 45%,rgba(43,67,99,.45),rgba(9,13,21,.2) 72%);border:1px solid rgba(173,194,227,.08)}
.particle-trail{fill:none;stroke:#799cc5;stroke-opacity:.3;stroke-width:.65;stroke-linecap:round;stroke-linejoin:round}
.particle-dot{transform-box:fill-box;transform-origin:center;animation:particle-float 5.8s ease-in-out infinite alternate}
#particle-life-link{position:fixed;z-index:8;top:15px;left:18px;padding:8px 10px;border:1px solid rgba(173,194,227,.14);background:rgba(8,10,16,.68);color:var(--muted);font-size:10px;letter-spacing:.12em;text-decoration:none;backdrop-filter:blur(8px)}
#particle-life-link:hover,#particle-life-link:focus-visible,#sound-space-link:hover,#sound-space-link:focus-visible,#score-space-link:hover,#score-space-link:focus-visible,#shared-canvas-link:hover,#shared-canvas-link:focus-visible{color:var(--ink);border-color:rgba(173,204,250,.5);outline:none}
#sound-space-link{position:fixed;z-index:8;top:54px;left:18px;padding:8px 10px;border:1px solid rgba(173,194,227,.14);background:rgba(8,10,16,.68);color:var(--muted);font-size:10px;letter-spacing:.12em;text-decoration:none;backdrop-filter:blur(8px)}
#score-space-link{position:fixed;z-index:8;top:93px;left:18px;padding:8px 10px;border:1px solid rgba(173,194,227,.14);background:rgba(8,10,16,.68);color:var(--muted);font-size:10px;letter-spacing:.12em;text-decoration:none;backdrop-filter:blur(8px)}
#shared-canvas-link{position:fixed;z-index:8;top:132px;left:18px;padding:8px 10px;border:1px solid rgba(173,194,227,.2);background:rgba(8,10,16,.78);color:#d6e2f4;font-size:10px;letter-spacing:.12em;text-decoration:none;backdrop-filter:blur(8px)}
@media(max-width:540px){#particle-life-link{top:10px;left:10px;font-size:9px;padding:7px 8px}#sound-space-link{top:47px;left:10px;font-size:9px;padding:7px 8px}#score-space-link{top:84px;left:10px;font-size:9px;padding:7px 8px}#shared-canvas-link{top:121px;left:10px;font-size:9px;padding:7px 8px}}
body.sound-active .particle-field{border-color:rgba(228,205,161,.62);box-shadow:0 0 28px rgba(228,205,161,.16)}
body.sound-active .particle-dot{filter:drop-shadow(0 0 4px rgba(228,205,161,.82))}
.transform-trace:hover,.transform-trace:focus-visible{background:rgba(28,36,53,.64);border-color:rgba(173,204,250,.38);outline:none}
.transform-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.image-trace{display:flex;flex-direction:column;gap:10px;position:relative;flex:0 1 min(430px,86vw);max-width:min(430px,86vw);min-width:min(250px,86vw);padding:clamp(12px,1.8vw,22px);border:1px solid rgba(173,194,227,.13);background:rgba(13,17,27,.48);box-shadow:0 12px 50px rgba(0,0,0,.1);pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.image-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:9px;letter-spacing:.1em;color:var(--muted);overflow-wrap:anywhere}
.image-source{color:#d6e2f4;text-decoration:none;overflow-wrap:anywhere}
.image-source:hover,.image-source:focus-visible{color:var(--ink);outline:none}
.image-preview-link{display:flex;align-items:center;justify-content:center;min-height:90px;max-height:55vh;overflow:hidden;background:rgba(7,11,18,.6);border:1px solid rgba(173,194,227,.08);text-decoration:none;color:var(--muted);font-size:10px;letter-spacing:.08em}
.image-preview{display:block;width:100%;height:auto;max-height:52vh;object-fit:contain}
.image-title{font-size:11px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.image-trace:hover,.image-trace:focus-within{background:rgba(28,36,53,.64);border-color:rgba(173,204,250,.38)}
.image-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.external-source{display:flex;flex-direction:column;gap:10px;position:relative;flex:0 1 min(430px,86vw);max-width:min(430px,86vw);min-width:min(250px,86vw);padding:clamp(12px,1.8vw,22px);border:1px solid rgba(173,194,227,.16);background:rgba(13,17,27,.54);box-shadow:0 12px 50px rgba(0,0,0,.12);pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s;overflow-wrap:anywhere}
.external-source:hover,.external-source:focus-within{background:rgba(28,36,53,.68);border-color:rgba(173,204,250,.4)}
.external-source.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.external-source-head,.external-source-foot{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap;font-size:9px;letter-spacing:.08em;color:var(--muted)}
.external-source-file,.external-source-origin{color:#d6e2f4;text-decoration:none;overflow-wrap:anywhere}
.external-source-file:hover,.external-source-origin:hover{color:var(--ink)}
.external-source-kind{color:#e4cda1;text-transform:uppercase;letter-spacing:.14em}
.external-source-media{display:flex;align-items:center;justify-content:center;min-height:74px;max-height:55vh;overflow:hidden;background:rgba(7,11,18,.6);border:1px solid rgba(173,194,227,.08);color:#d6e2f4;text-decoration:none;font-size:10px;letter-spacing:.08em}
.external-source-media img{display:block;width:100%;height:auto;max-height:50vh;object-fit:contain}
.external-source-media video{display:block;width:100%;max-height:50vh;background:#05070b}
.external-source-media audio{width:100%;max-width:100%}
video.external-source-content{display:block;width:100%;max-height:50vh;background:#05070b}
audio.external-source-content{display:block;width:100%;max-width:100%}
.external-source-description{font-size:11px;line-height:1.5;color:var(--muted);white-space:pre-wrap}
.external-source-meta{font-size:9px;line-height:1.5;color:var(--muted);overflow-wrap:anywhere}
.sound-trace{display:flex;flex-direction:column;gap:12px;position:relative;flex:0 1 min(430px,86vw);max-width:min(430px,86vw);min-width:min(290px,90vw);padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.13);background:rgba(13,17,27,.48);box-shadow:0 12px 50px rgba(0,0,0,.1);pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.sound-head,.sound-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sound-source{color:var(--muted);text-decoration:none;font-size:9px;letter-spacing:.1em;overflow-wrap:anywhere}
.sound-source:hover,.sound-source:focus-visible{color:var(--ink);outline:none}
.sound-kind{font-size:10px;letter-spacing:.14em;color:#d6e2f4;text-transform:uppercase}
.sound-wave{display:block;width:100%;height:auto;aspect-ratio:7/2;background:rgba(7,11,18,.5);border:1px solid rgba(173,194,227,.08)}
.sound-wave path{fill:none;stroke:#a5c8f4;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.8}
.sound-wave .wave-glow{stroke:#709bd4;stroke-width:4;stroke-opacity:.12}
.sound-play{border:1px solid rgba(173,204,250,.28);border-radius:2px;padding:8px 12px;background:rgba(28,36,53,.54);color:var(--ink);font:inherit;font-size:10px;letter-spacing:.12em;cursor:pointer;pointer-events:auto}
.sound-play:hover,.sound-play:focus-visible{background:rgba(44,59,83,.8);outline:1px solid rgba(173,204,250,.34)}
.sound-play[aria-pressed="true"]{border-color:rgba(228,205,161,.55);color:#e4cda1}
.sound-meta{font-size:9px;line-height:1.5;letter-spacing:.1em;color:var(--muted)}
.sound-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
@keyframes particle-float{to{transform:translateY(-2px);opacity:.58}}
#readout{position:fixed;z-index:5;left:18px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:10px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;user-select:none;pointer-events:none;opacity:.8}
.value{color:#d6e2f4;letter-spacing:.04em}
#state{position:fixed;z-index:5;right:18px;bottom:16px;display:flex;gap:7px;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
#state-mark{width:5px;height:5px;border-radius:50%;background:#8796a9}
#state[data-state="live"] #state-mark{background:#9fc9b1;box-shadow:0 0 9px rgba(159,201,177,.65)}
#state[data-state="error"] #state-mark{background:#d5a29a}
#history-control{position:fixed;z-index:8;top:14px;right:18px;display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--muted);font-size:10px;letter-spacing:.12em;background:rgba(8,10,16,.78);border:1px solid rgba(173,194,227,.14);backdrop-filter:blur(8px)}
#history-select{max-width:min(48vw,380px);border:0;outline:none;background:transparent;color:var(--ink);font:inherit;letter-spacing:.03em;cursor:pointer}
#history-select option{background:#101521;color:#e8edf4}
body[data-view="past"] #history-control{border-color:rgba(228,205,161,.3)}
@media(max-width:540px){#history-control{top:10px;right:10px;gap:7px;padding:7px 8px;font-size:9px}#history-select{max-width:58vw}}
@keyframes pulse{0%{transform:scale(.65);opacity:.75}100%{transform:scale(3.1);opacity:0}}
@keyframes appear{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:blur(0)}}
@keyframes glow{0%{filter:brightness(2.8)}100%{filter:brightness(1)}}
@keyframes drift{to{transform:translate3d(31px,31px,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:540px){#board{padding:6vh 5vw 76px;gap:14px}.couplet{max-width:90vw;padding:14px;font-size:19px}#readout{left:10px;bottom:10px;gap:6px 10px;font-size:9px}#state{right:10px;bottom:10px;font-size:9px}}
.live-field-reading{font-size:10px;line-height:1.6;color:var(--muted);letter-spacing:.04em;overflow-wrap:anywhere}
.live-field-reading[hidden]{display:none}
</style>
</head>
<body>
<div id="field" aria-hidden="true"><svg id="connections" xmlns="http://www.w3.org/2000/svg"></svg></div>
<main id="board"></main>
<a id="particle-life-link" href="./particle-life.html">PARTICLE LIFE ↗</a>
<a id="sound-space-link" href="./sound-space.html">SOUND SPACE ↗</a>
<a id="score-space-link" href="./score-space.html">SCORE SPACE ↗</a>
<a id="shared-canvas-link" href="./canvas.html">SHARED CANVAS ↗</a>
<div id="readout" aria-live="off">
<span>TRACES <span class="value" id="count">—</span></span>
<span>COUPLETS <span class="value" id="couplet-count">—</span></span>
<span>COLORS <span class="value" id="color-count">—</span></span>
<span>CANVAS LAYERS <span class="value" id="pixel-count">—</span></span>
<span>VECTORS <span class="value" id="vector-count">—</span></span>
<span>LINKS <span class="value" id="link-count">—</span></span>
<span>TRANSFORMS <span class="value" id="transform-count">—</span></span>
<span>SOUNDS <span class="value" id="sound-count">—</span></span>
<span>IMAGES <span class="value" id="image-count">—</span></span>
<span>WEB SOURCES <span class="value" id="source-count">—</span></span>
<span>NEW → SEEN <span class="value" id="latency">—</span></span>
</div>
<div id="history-control"><label for="history-select">TIME</label><select id="history-select" aria-label="Choose a previous state"><option value="now">NOW</option></select></div>
<div id="state" data-state="wait"><span id="state-mark"></span><span id="state-text">WAITING</span></div>
<script>
(()=>{'use strict';
const POLL_MS=3000,field=document.getElementById('field'),board=document.getElementById('board'),connections=document.getElementById('connections'),historySelect=document.getElementById('history-select'),countNode=document.getElementById('count'),coupletCountNode=document.getElementById('couplet-count'),vectorCountNode=document.getElementById('vector-count'),linkCountNode=document.getElementById('link-count'),transformCountNode=document.getElementById('transform-count'),soundCountNode=document.getElementById('sound-count'),sourceCountNode=document.getElementById('source-count'),latencyNode=document.getElementById('latency'),stateNode=document.getElementById('state'),stateText=document.getElementById('state-text');
const points=new Map(),markers=new Map(),coupletNodes=new Map(),colorNodes=new Map(),pixelNodes=new Map(),vectorNodes=new Map(),transformNodes=new Map(),soundNodes=new Map(),imageNodes=new Map(),sourceNodes=new Map(),connectionNodes=new Map(),soundPlayers=new Map(),liveDataFieldStates=new Map();let knownItems=new Set(),knownCouplets=new Map(),knownColors=new Map(),knownPixels=new Map(),knownVectors=new Map(),knownTransforms=new Map(),knownSounds=new Map(),knownImages=new Map(),knownSources=new Map(),knownLinks=new Map(),currentLinks=[],initialized=false,busy=false,liveManifest=null,historySnapshots=[],selectedHistory='now',historyLoaded=false;
function hash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pointFor(id){if(!points.has(id))points.set(id,{x:7+(hash(id+':x')%8600)/100,y:9+(hash(id+':y')%8000)/100});return points.get(id)}
function setState(value,label){stateNode.dataset.state=value;stateText.textContent=label}
function fileUrl(manifest,path){const repo=String(manifest.repository||'');const safePath=path.split('/').map(encodeURIComponent).join('/');return /^[^/]+\/[^/]+$/.test(repo)?'https://github.com/'+repo+'/blob/'+encodeURIComponent(manifest.ref||'main')+'/'+safePath:'#'}
function flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function renderItems(ids,manifest,fresh){
const live=new Set(ids);
for(const [id,el] of markers){if(!live.has(id)){el.remove();markers.delete(id)}}
for(const id of ids){if(typeof id!=='string'||!id)continue;let el=markers.get(id);
if(!el){el=document.createElement('a');el.className='presence';el.setAttribute('aria-label','Presence');el.title='';el.rel='noopener noreferrer';el.target='_blank';const p=pointFor(id);el.style.setProperty('--x',p.x+'%');el.style.setProperty('--y',p.y+'%');field.appendChild(el);markers.set(id,el)}
el.href=fileUrl(manifest,id);if(fresh.has(id))flash(el,'is-new');
}
countNode.textContent=String(live.size);
}
function renderCouplets(entries,manifest,changed){
const live=new Set(entries.map(item=>item.path));
for(const [path,el] of coupletNodes){if(!live.has(path)){el.remove();coupletNodes.delete(path)}}
for(const item of entries){
if(typeof item.path!=='string'||typeof item.text!=='string')continue;
let el=coupletNodes.get(item.path);
if(!el){el=document.createElement('a');el.className='couplet';el.target='_blank';el.rel='noopener noreferrer';el.setAttribute('aria-label','Couplet');el.title='';board.appendChild(el);coupletNodes.set(item.path,el)}
el.href=fileUrl(manifest,item.path);
if(el.textContent!==item.text){el.textContent=item.text;if(changed.has(item.path))flash(el,'changed')}
}
coupletCountNode.textContent=String(entries.length);
}
function renderColors(entries,manifest,changed){
const live=new Set(entries.map(item=>item.path));
for(const [path,el] of colorNodes){if(!live.has(path)){el.remove();colorNodes.delete(path)}}
for(const item of entries){
if(typeof item.path!=='string'||typeof item.color!=='string'||!/^#[0-9a-f]{6}$/i.test(item.color))continue;
let el=colorNodes.get(item.path);

function edgePoint(rect,targetX,targetY){
const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=targetX-cx,dy=targetY-cy;

const t=Math.min(...factors);

}
