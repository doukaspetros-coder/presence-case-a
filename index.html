<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title></title>
<style>
:root{color-scheme:dark;--ink:#e8edf4;--muted:#7f899a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#080a10}
body{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:radial-gradient(ellipse at 50% 44%,rgba(37,48,71,.42),transparent 57%),#080a10;overflow-x:hidden}
#field{position:fixed;inset:0;overflow:hidden;pointer-events:none}
#connections{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
#field:before{content:"";position:absolute;inset:-20%;opacity:.22;background-image:radial-gradient(rgba(184,199,219,.22) .7px,transparent .8px);background-size:31px 31px;mask-image:radial-gradient(ellipse at center,#000,transparent 78%);animation:drift 100s linear infinite}
.presence{--x:50%;--y:50%;position:absolute;left:var(--x);top:var(--y);z-index:1;display:block;width:7px;height:7px;padding:0;transform:translate(-50%,-50%);border:0;border-radius:50%;background:rgba(218,232,255,.88);box-shadow:0 0 8px rgba(152,195,255,.72),0 0 25px rgba(91,153,226,.25);cursor:pointer;opacity:.9;animation:appear .75s ease-out both;pointer-events:auto}
.presence:before,.presence:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(171,204,250,.32);border-radius:50%;animation:pulse 3.6s ease-out infinite}
.presence:after{animation-delay:1.8s}
.presence:hover{background:#fff;box-shadow:0 0 12px rgba(190,218,255,.95),0 0 34px rgba(91,153,226,.4)}
.is-new{animation:appear .75s ease-out both,glow 2.6s ease-out 1!important}
#board{position:relative;z-index:2;min-height:100svh;width:100%;padding:8vh 6vw 78px;display:flex;flex-wrap:wrap;align-content:center;align-items:center;justify-content:center;gap:clamp(18px,3.6vw,56px);pointer-events:none}
.couplet{display:block;position:relative;max-width:min(520px,86vw);padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.1);background:rgba(13,17,27,.34);backdrop-filter:blur(4px);color:var(--ink);text-decoration:none;white-space:pre-line;font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,2.1vw,27px);line-height:1.65;letter-spacing:.015em;box-shadow:0 12px 50px rgba(0,0,0,.08);transition:background .3s,border-color .3s,transform .5s;pointer-events:auto;animation:appear 1.1s ease-out both}
.couplet:nth-child(3n+1){transform:rotate(-.7deg)}
.couplet:nth-child(3n+2){transform:rotate(.45deg);margin-top:2vh}
.couplet:nth-child(3n){transform:rotate(.9deg);margin-bottom:2vh}
.couplet:hover,.couplet:focus-visible{background:rgba(28,36,53,.64);border-color:rgba(173,204,250,.38);outline:none}
.couplet.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.vector-trace{display:flex;position:relative;flex:0 1 min(430px,86vw);align-items:center;justify-content:center;min-height:150px;max-height:58vh;padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.12);background:rgba(13,17,27,.42);box-shadow:0 12px 50px rgba(0,0,0,.1);text-decoration:none;pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.vector-trace img{display:block;width:100%;height:auto;max-width:100%;max-height:50vh;object-fit:contain}
.vector-trace:hover,.vector-trace:focus-visible{background:rgba(28,36,53,.64);border-color:rgba(173,204,250,.38);outline:none}
.vector-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.transform-trace{display:block;position:relative;flex:0 1 min(430px,86vw);max-width:min(430px,86vw);padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.12);background:rgba(13,17,27,.42);box-shadow:0 12px 50px rgba(0,0,0,.1);text-decoration:none;pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.transform-meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:9px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);overflow-wrap:anywhere}
.transform-kind{color:#d6e2f4}
.transform-source{max-width:100%;letter-spacing:.02em;text-transform:none;overflow-wrap:anywhere}
.particle-field{display:block;width:100%;height:auto;aspect-ratio:7/4;background:radial-gradient(ellipse at 50% 45%,rgba(43,67,99,.45),rgba(9,13,21,.2) 72%);border:1px solid rgba(173,194,227,.08)}
.particle-trail{fill:none;stroke:#799cc5;stroke-opacity:.3;stroke-width:.65;stroke-linecap:round;stroke-linejoin:round}
.particle-dot{transform-box:fill-box;transform-origin:center;animation:particle-float 5.8s ease-in-out infinite alternate}
body.sound-active .particle-field{border-color:rgba(228,205,161,.62);box-shadow:0 0 28px rgba(228,205,161,.16)}
body.sound-active .particle-dot{filter:drop-shadow(0 0 4px rgba(228,205,161,.82))}
.transform-trace:hover,.transform-trace:focus-visible{background:rgba(28,36,53,.64);border-color:rgba(173,204,250,.38);outline:none}
.transform-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
.sound-trace{display:flex;flex-direction:column;gap:12px;position:relative;flex:0 1 min(430px,86vw);max-width:min(430px,86vw);min-width:min(290px,90vw);padding:clamp(14px,2.1vw,28px);border:1px solid rgba(173,194,227,.13);background:rgba(13,17,27,.48);box-shadow:0 12px 50px rgba(0,0,0,.1);pointer-events:auto;animation:appear 1.1s ease-out both;transition:background .3s,border-color .3s}
.sound-head,.sound-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sound-source{color:var(--muted);text-decoration:none;font-size:9px;letter-spacing:.1em;overflow-wrap:anywhere}
.sound-source:hover,.sound-source:focus-visible{color:var(--ink);outline:none}
.sound-kind{font-size:10px;letter-spacing:.14em;color:#d6e2f4;text-transform:uppercase}
.sound-wave{display:block;width:100%;height:auto;aspect-ratio:7/2;background:rgba(7,11,18,.5);border:1px solid rgba(173,194,227,.08)}
.sound-wave path{fill:none;stroke:#a5c8f4;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;stroke-opacity:.8}
.sound-wave .wave-glow{stroke:#709bd4;stroke-width:4;stroke-opacity:.12}
.sound-play{border:1px solid rgba(173,204,250,.28);border-radius:2px;padding:8px 12px;background:rgba(28,36,53,.54);color:var(--ink);font:inherit;font-size:10px;letter-spacing:.12em;cursor:pointer;pointer-events:auto}
.sound-play:hover,.sound-play:focus-visible{background:rgba(44,59,83,.8);outline:1px solid rgba(173,204,250,.34)}
.sound-play[aria-pressed="true"]{border-color:rgba(228,205,161,.55);color:#e4cda1}
.sound-meta{font-size:9px;line-height:1.5;letter-spacing:.1em;color:var(--muted)}
.sound-trace.changed{animation:appear .7s ease-out both,glow 2.6s ease-out 1!important}
@keyframes particle-float{to{transform:translateY(-2px);opacity:.58}}
#readout{position:fixed;z-index:5;left:18px;bottom:16px;display:flex;flex-wrap:wrap;gap:8px 16px;color:var(--muted);font-size:10px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;user-select:none;pointer-events:none;opacity:.8}
.value{color:#d6e2f4;letter-spacing:.04em}
#state{position:fixed;z-index:5;right:18px;bottom:16px;display:flex;gap:7px;align-items:center;color:var(--muted);font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
#state-mark{width:5px;height:5px;border-radius:50%;background:#8796a9}
#state[data-state="live"] #state-mark{background:#9fc9b1;box-shadow:0 0 9px rgba(159,201,177,.65)}
#state[data-state="error"] #state-mark{background:#d5a29a}
#history-control{position:fixed;z-index:8;top:14px;right:18px;display:flex;align-items:center;gap:10px;padding:8px 10px;color:var(--muted);font-size:10px;letter-spacing:.12em;background:rgba(8,10,16,.78);border:1px solid rgba(173,194,227,.14);backdrop-filter:blur(8px)}
#history-select{max-width:min(48vw,380px);border:0;outline:none;background:transparent;color:var(--ink);font:inherit;letter-spacing:.03em;cursor:pointer}
#history-select option{background:#101521;color:#e8edf4}
body[data-view="past"] #history-control{border-color:rgba(228,205,161,.3)}
@media(max-width:540px){#history-control{top:10px;right:10px;gap:7px;padding:7px 8px;font-size:9px}#history-select{max-width:58vw}}
@keyframes pulse{0%{transform:scale(.65);opacity:.75}100%{transform:scale(3.1);opacity:0}}
@keyframes appear{from{opacity:0;filter:blur(3px)}to{opacity:1;filter:blur(0)}}
@keyframes glow{0%{filter:brightness(2.8)}100%{filter:brightness(1)}}
@keyframes drift{to{transform:translate3d(31px,31px,0)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media(max-width:540px){#board{padding:6vh 5vw 76px;gap:14px}.couplet{max-width:90vw;padding:14px;font-size:19px}#readout{left:10px;bottom:10px;gap:6px 10px;font-size:9px}#state{right:10px;bottom:10px;font-size:9px}}
</style>
</head>
<body>
<div id="field" aria-hidden="true"><svg id="connections" xmlns="http://www.w3.org/2000/svg"></svg></div>
<main id="board"></main>
<div id="readout" aria-live="off">
<span>TRACES <span class="value" id="count">0</span></span>
<span>COUPLETS <span class="value" id="couplet-count">0</span></span>
<span>VECTORS <span class="value" id="vector-count">0</span></span>
<span>LINKS <span class="value" id="link-count">0</span></span>
<span>TRANSFORMS <span class="value" id="transform-count">0</span></span>
<span>SOUNDS <span class="value" id="sound-count">0</span></span>
<span>NEW → SEEN <span class="value" id="latency">—</span></span>
</div>
<div id="history-control"><label for="history-select">TIME</label><select id="history-select" aria-label="Choose a previous state"><option value="now">NOW</option></select></div>
<div id="state" data-state="wait"><span id="state-mark"></span><span id="state-text">WAITING</span></div>
<script>
(()=>{'use strict';
const POLL_MS=3000,field=document.getElementById('field'),board=document.getElementById('board'),connections=document.getElementById('connections'),historySelect=document.getElementById('history-select'),countNode=document.getElementById('count'),coupletCountNode=document.getElementById('couplet-count'),vectorCountNode=document.getElementById('vector-count'),linkCountNode=document.getElementById('link-count'),transformCountNode=document.getElementById('transform-count'),soundCountNode=document.getElementById('sound-count'),latencyNode=document.getElementById('latency'),stateNode=document.getElementById('state'),stateText=document.getElementById('state-text');
const points=new Map(),markers=new Map(),coupletNodes=new Map(),vectorNodes=new Map(),transformNodes=new Map(),soundNodes=new Map(),connectionNodes=new Map(),soundPlayers=new Map();let knownItems=new Set(),knownCouplets=new Map(),knownVectors=new Map(),knownTransforms=new Map(),knownSounds=new Map(),knownLinks=new Map(),currentLinks=[],initialized=false,busy=false,liveManifest=null,historySnapshots=[],selectedHistory='now',historyLoaded=false;
function hash(text){let h=2166136261;for(let i=0;i<text.length;i++){h^=text.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function pointFor(id){if(!points.has(id))points.set(id,{x:7+(hash(id+':x')%8600)/100,y:9+(hash(id+':y')%8000)/100});return points.get(id)}
function setState(value,label){stateNode.dataset.state=value;stateText.textContent=label}
function fileUrl(manifest,path){const repo=String(manifest.repository||'');const safePath=path.split('/').map(encodeURIComponent).join('/');return /^[^/]+\/[^/]+$/.test(repo)?'https://github.com/'+repo+'/blob/'+encodeURIComponent(manifest.ref||'main')+'/'+safePath:'#'}
function flash(el,cls){el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls)}
function renderItems(ids,manifest,fresh){
const live=new Set(ids);
for(const [id,el] of markers){if(!live.has(id)){el.remove();markers.delete(id)}}
for(const id of ids){if(typeof id!=='string'||!id)continue;let el=markers.get(id);

}
function renderCouplets(entries,manifest,changed){
const live=new Set(entries.map(item=>item.path));
for(const [path,el] of coupletNodes){if(!live.has(path)){el.remove();coupletNodes.delete(path)}}
for(const item of entries){
if(typeof item.path!=='string'||typeof item.text!=='string')continue;
let el=coupletNodes.get(item.path);
if(!el){el=document.createElement('a');el.className='couplet';el.target='_blank';el.rel='noopener noreferrer';el.setAttribute('aria-label','Couplet');el.title='';board.appendChild(el);coupletNodes.set(item.path,el)}
el.href=fileUrl(manifest,item.path);

}

}
function renderVectors(entries,manifest,changed){
const live=new Set(entries.map(item=>item.path));
for(const [path,el] of vectorNodes){if(!live.has(path)){el.remove();vectorNodes.delete(path)}}
for(const item of entries){
if(typeof item.path!=='string'||!item.path.startsWith('vectors/')||!item.path.toLowerCase().endsWith('.svg'))continue;
let el=vectorNodes.get(item.path);
if(!el){
el=document.createElement('a');el.className='vector-trace';el.target='_blank';el.rel='noopener noreferrer';el.setAttribute('aria-label','Vector trace: '+item.path);el.title=item.path;
const img=document.createElement('img');img.alt='';img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.addEventListener('load',drawConnections);el.appendChild(img);board.appendChild(el);vectorNodes.set(item.path,el);
}
el.href=fileUrl(manifest,item.path);
const img=el.querySelector('img'),revision=String(item.digest||manifest.commit||'');
if(img.dataset.revision!==revision){
const safePath=item.path.split('/').map(encodeURIComponent).join('/');
const assetPath=manifest.ref&&manifest.ref!=='main'?'https://raw.githubusercontent.com/'+manifest.repository+'/'+encodeURIComponent(manifest.ref)+'/'+safePath:safePath;const assetUrl=new URL(assetPath,location.href);if(revision)assetUrl.searchParams.set('v',revision);
img.src=assetUrl.href;img.dataset.revision=revision;
}
if(changed.has(item.path))flash(el,'changed');
}
vectorCountNode.textContent=String(entries.length);
}
function traceNode(path){return markers.get(path)||coupletNodes.get(path)||vectorNodes.get(path)||transformNodes.get(path)||soundNodes.get(path)||null}
function stopSound(path){
const player=soundPlayers.get(path);if(!player)return;
soundPlayers.delete(path);if(player.timer)clearTimeout(player.timer);if(player.frame)cancelAnimationFrame(player.frame);
for(const oscillator of player.oscillators){try{oscillator.stop()}catch{}}
for(const svg of document.querySelectorAll('.particle-field')){for(const dot of svg.querySelectorAll('.particle-dot')){dot.setAttribute('cy',dot.dataset.baseY||dot.getAttribute('cy'));dot.setAttribute('r',dot.dataset.baseR||dot.getAttribute('r'));dot.setAttribute('fill-opacity',dot.dataset.baseOpacity||dot.getAttribute('fill-opacity'))}}
try{player.context.close()}catch{}
if(player.button){player.button.textContent='PLAY';player.button.setAttribute('aria-pressed','false')}
if(soundPlayers.size===0)document.body.classList.remove('sound-active');
}
function stopAllSounds(){for(const path of [...soundPlayers.keys()])stopSound(path)}
function waveformFor(svg,item){
while(svg.firstChild)svg.removeChild(svg.firstChild);
svg.setAttribute('viewBox','0 0 420 120');svg.setAttribute('role','img');svg.setAttribute('aria-label','Waveform preview');
const notes=Array.isArray(item.notes)?item.notes:[];if(!notes.length)return;
const gap=Math.max(0,Math.min(.5,Number(item.gap)||0)),duration=notes.reduce((sum,n)=>sum+Number(n.duration||.2)+gap,0)||1;
let x=0,phase=0;const points=[];
for(let i=0;i<notes.length;i++){
const note=notes[i],w=420*(Number(note.duration||.2)+gap)/duration,frequency=Number(note.frequency)||220;
const cycles=Math.max(1,Math.min(6,frequency/90)),amp=13+Math.min(17,Number(note.duration||.2)*22);
const samples=Math.max(8,Math.round(w/2.2));
for(let j=0;j<=samples;j++){
const local=j/samples,px=x+w*local;
const envelope=Math.min(1,local*10,(1-local)*10);
const py=60-Math.sin((phase+local)*Math.PI*2*cycles)*amp*Math.max(0,envelope);
points.push((points.length?'L ':'M ')+px.toFixed(2)+' '+py.toFixed(2));
}
x+=w;phase+=cycles;
}
const glow=document.createElementNS('http://www.w3.org/2000/svg','path');glow.setAttribute('class','wave-glow');glow.setAttribute('d',points.join(' '));svg.appendChild(glow);
const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d',points.join(' '));svg.appendChild(line);
}
async function playSound(item,card,button){
if(soundPlayers.has(item.path)){stopSound(item.path);return}
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
if(!AudioContextClass){button.textContent='NO WEB AUDIO';return}
stopAllSounds();
let context;
try{context=new AudioContextClass();await context.resume()}catch(e){try{context&&context.close()}catch{}button.textContent='AUDIO UNAVAILABLE';return}
const master=context.createGain();master.gain.value=Math.max(.01,Math.min(.16,Number(item.gain)||.085));
const analyser=context.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.72;master.connect(analyser);analyser.connect(context.destination);
const player={context,oscillators:[],timer:null,button,analyser,bins:new Uint8Array(analyser.frequencyBinCount),frame:null,startedAt:context.currentTime};soundPlayers.set(item.path,player);
document.body.classList.add('sound-active');
button.textContent='STOP';button.setAttribute('aria-pressed','true');
const animateParticles=()=>{if(soundPlayers.get(item.path)!==player)return;analyser.getByteFrequencyData(player.bins);let bass=0,treble=0;for(let i=1;i<7;i++)bass+=player.bins[i];for(let i=9;i<42;i++)treble+=player.bins[i];bass=Math.min(1,bass/(6*150));treble=Math.min(1,treble/(33*150));const energy=Math.min(1,bass*.7+treble*.3);const t=context.currentTime-player.startedAt;for(const svg of document.querySelectorAll('.particle-field')){const dots=svg.querySelectorAll('.particle-dot');dots.forEach((dot,i)=>{const by=Number(dot.dataset.baseY||dot.getAttribute('cy')),br=Number(dot.dataset.baseR||dot.getAttribute('r')),bo=Number(dot.dataset.baseOpacity||dot.getAttribute('fill-opacity'));dot.setAttribute('cy',(by+Math.sin(t*(2.2+treble*11)+i*.83)*(1+treble*13)+Math.sin(t*2.7+i*.31)*bass*5).toFixed(2));dot.setAttribute('r',(br*(1+bass*1.5+energy*.45)).toFixed(2));dot.setAttribute('fill-opacity',Math.min(1,bo*(.75+energy*1.8)).toFixed(2));});}player.frame=requestAnimationFrame(animateParticles)};player.frame=requestAnimationFrame(animateParticles);
let startAt=context.currentTime+.045;
const gap=Math.max(0,Math.min(.5,Number(item.gap)||0));
const waveforms=new Set(['sine','triangle','square','sawtooth']);
for(const note of (Array.isArray(item.notes)?item.notes:[])){
const frequency=Math.max(70,Math.min(1600,Number(note.frequency)||220));
const duration=Math.max(.08,Math.min(.8,Number(note.duration)||.22));
const oscillator=context.createOscillator(),gain=context.createGain();
oscillator.type=waveforms.has(item.waveform)?item.waveform:'sine';oscillator.frequency.setValueAtTime(frequency,startAt);
const peak=Math.max(.005,Math.min(.65,Number(note.gain)||.4));

gain.gain.setValueAtTime(peak,startAt+Math.max(.02,duration-.035));gain.gain.linearRampToValueAtTime(.0001,startAt+duration);

startAt+=duration+gap;

}
function renderSounds(entries,manifest,changed){
const live=new Set(entries.map(item=>item.path));
for(const [path,card] of soundNodes){if(!live.has(path)){stopSound(path);card.remove();soundNodes.delete(path)}}
for(const item of entries){
if(typeof item.path!=='string'||!item.path.startsWith('sounds/')||!item.path.toLowerCase().endsWith('.json')||item.mode!=='sequence'||!Array.isArray(item.notes))continue;
let card=soundNodes.get(item.path);
if(!card){
card=document.createElement('section');card.className='sound-trace';
const head=document.createElement('div');head.className='sound-head';
const link=document.createElement('a');link.className='sound-source';link.rel='noopener noreferrer';link.target='_blank';head.appendChild(link);
const kind=document.createElement('span');kind.className='sound-kind';kind.textContent='SOUND TRACE';head.appendChild(kind);card.appendChild(head);
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('sound-wave');card.appendChild(svg);
const foot=document.createElement('div');foot.className='sound-foot';
const button=document.createElement('button');button.className='sound-play';button.type='button';button.textContent='PLAY';button.setAttribute('aria-pressed','false');
button.addEventListener('click',()=>{const current=soundNodes.get(item.path);if(!current)return;const source=current._soundItem||item;playSound(source,current,button)});foot.appendChild(button);
const meta=document.createElement('span');meta.className='sound-meta';foot.appendChild(meta);card.appendChild(foot);board.appendChild(card);soundNodes.set(item.path,card);
}
const sourceLink=card.querySelector('a');sourceLink.href=fileUrl(manifest,item.path);sourceLink.textContent=item.path;
const validNotes=item.notes.filter(n=>n&&Number.isFinite(Number(n.frequency))&&Number(n.frequency)>=70&&Number(n.frequency)<=1600&&Number.isFinite(Number(n.duration))&&Number(n.duration)>=.08&&Number(n.duration)<=.8).slice(0,64);
const safeItem={...item,notes:validNotes,gain:Math.max(.01,Math.min(.16,Number(item.gain)||.085)),gap:Math.max(0,Math.min(.5,Number(item.gap)||0))};
card._soundItem=safeItem;card.title=item.path;
const digest=String(item.digest||JSON.stringify(safeItem));
if(card.dataset.revision!==digest){stopSound(item.path);waveformFor(card.querySelector('svg'),safeItem);card.dataset.revision=digest;const b=card.querySelector('button');b.textContent='PLAY';b.setAttribute('aria-pressed','false')}
card.querySelector('.sound-meta').textContent=String(validNotes.length)+' NOTES · '+(validNotes.reduce((a,n)=>a+Number(n.duration),0)+safeItem.gap*Math.max(0,validNotes.length-1)).toFixed(1)+' S';
if(changed.has(item.path))flash(card,'changed');
}
soundCountNode.textContent=String(entries.length);drawConnections();
}
function renderParticleField(svg,item){
while(svg.firstChild)svg.removeChild(svg.firstChild);
svg.setAttribute('viewBox','0 0 420 240');svg.setAttribute('role','img');svg.setAttribute('aria-label','Particle field derived from text');
const text=String(item.source_text||''),chars=Array.from(text).slice(0,180),coords=[];
for(let i=0;i<chars.length;i++){
const ch=chars[i],code=ch.codePointAt(0)||0,key=item.path+':'+i+':'+code+':'+text;
coords.push({x:18+(hash(key+':x')%384),y:18+(hash(key+':y')%204),r:.8+(hash(key+':r')%28)/10,opacity:.28+(hash(key+':o')%66)/100,warm:(code+i)%9===0,delay:((i%17)*.17).toFixed(2)});
}
if(coords.length>1){
const trail=document.createElementNS('http://www.w3.org/2000/svg','path');trail.setAttribute('class','particle-trail');
trail.setAttribute('d',coords.map((p,i)=>(i?'L ':'M ')+p.x+' '+p.y).join(' '));svg.appendChild(trail);
}
for(const p of coords){
const dot=document.createElementNS('http://www.w3.org/2000/svg','circle');dot.setAttribute('class','particle-dot');
dot.setAttribute('cx',String(p.x));dot.setAttribute('cy',String(p.y));dot.setAttribute('r',String(p.r));
dot.setAttribute('fill',p.warm?'#e2cda6':'#b7d2f5');dot.setAttribute('fill-opacity',String(p.opacity));
dot.dataset.baseY=String(p.y);dot.dataset.baseR=String(p.r);dot.dataset.baseOpacity=String(p.opacity);
dot.style.animationDelay='-'+p.delay+'s';svg.appendChild(dot);
}
}
function renderTransformations(entries,manifest,changed){
const live=new Set(entries.map(item=>item.path));
for(const [path,el] of transformNodes){if(!live.has(path)){el.remove();transformNodes.delete(path)}}
for(const item of entries){
if(typeof item.path!=='string'||!item.path.startsWith('transformations/')||!item.path.toLowerCase().endsWith('.json')||item.mode!=='text-particles'||typeof item.source!=='string'||typeof item.source_text!=='string')continue;
let el=transformNodes.get(item.path);
if(!el){
el=document.createElement('a');el.className='transform-trace';el.target='_blank';el.rel='noopener noreferrer';el.setAttribute('aria-label','Text to particles transformation');
const meta=document.createElement('div');meta.className='transform-meta';
const kind=document.createElement('span');kind.className='transform-kind';kind.textContent='TEXT → PARTICLES';
const source=document.createElement('span');source.className='transform-source';source.textContent=item.source;
meta.appendChild(kind);meta.appendChild(source);el.appendChild(meta);
const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.classList.add('particle-field');el.appendChild(svg);
board.appendChild(el);transformNodes.set(item.path,el);
}
el.href=fileUrl(manifest,item.path);el.title=item.source+' · '+item.path;
const meta=el.children[0];if(meta&&meta.children[1])meta.children[1].textContent=item.source;
const revision=String(item.digest||hash(item.source_text));
if(el.dataset.revision!==revision){renderParticleField(el.querySelector('svg'),item);el.dataset.revision=revision}
if(changed.has(item.path))flash(el,'changed');
}
transformCountNode.textContent=String(entries.length);drawConnections();
}
function edgePoint(rect,targetX,targetY){
const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2,dx=targetX-cx,dy=targetY-cy;
if(dx===0&&dy===0)return{x:cx,y:cy};
const factors=[];
if(dx!==0)factors.push((rect.width/2)/Math.abs(dx));
if(dy!==0)factors.push((rect.height/2)/Math.abs(dy));
const t=Math.min(...factors);
return{x:cx+dx*t,y:cy+dy*t};
}
function drawConnections(){
const width=Math.max(1,window.innerWidth||document.documentElement.clientWidth||1),height=Math.max(1,window.innerHeight||document.documentElement.clientHeight||1);
connections.setAttribute('viewBox','0 0 '+width+' '+height);connections.setAttribute('width',String(width));connections.setAttribute('height',String(height));
for(const item of currentLinks){
const nodes=connectionNodes.get(item.path);if(!nodes)continue;
const from=traceNode(item.from),to=traceNode(item.to);
if(!from||!to){nodes.group.style.display='none';continue}
nodes.group.style.display='';
const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
let d,sx,sy,ex,ey;
if(item.from===item.to){
const cx=a.left+a.width/2,cy=a.top+a.height/2;
sx=cx-7;sy=cy-3;ex=cx+7;ey=cy-3;
d='M '+sx+' '+sy+' C '+(cx-25)+' '+(cy-31)+', '+(cx+25)+' '+(cy-31)+', '+ex+' '+ey;
}else{
const acx=a.left+a.width/2,acy=a.top+a.height/2,bcx=b.left+b.width/2,bcy=b.top+b.height/2;
const start=edgePoint(a,bcx,bcy),end=edgePoint(b,acx,acy);
sx=start.x;sy=start.y;ex=end.x;ey=end.y;
d='M '+sx+' '+sy+' L '+ex+' '+ey;
}
nodes.path.setAttribute('d',d);
nodes.start.setAttribute('cx',String(sx));nodes.start.setAttribute('cy',String(sy));
nodes.end.setAttribute('cx',String(ex));nodes.end.setAttribute('cy',String(ey));
}
}
function renderLinks(entries,manifest,changed){
const live=new Set(entries.map(item=>item.path));
for(const [path,nodes] of connectionNodes){if(!live.has(path)){nodes.group.remove();connectionNodes.delete(path)}}
currentLinks=[];
let visible=0;
for(const item of entries){
if(typeof item.path!=='string'||!item.path.startsWith('links/')||!item.path.toLowerCase().endsWith('.json')||typeof item.from!=='string'||typeof item.to!=='string')continue;
let nodes=connectionNodes.get(item.path);
if(!nodes){
const group=document.createElementNS('http://www.w3.org/2000/svg','g');group.setAttribute('class','connection');
const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('fill','none');line.setAttribute('stroke','#91b8e8');line.setAttribute('stroke-width','1.2');line.setAttribute('stroke-opacity','0.62');line.setAttribute('stroke-linecap','round');line.setAttribute('vector-effect','non-scaling-stroke');
const start=document.createElementNS('http://www.w3.org/2000/svg','circle');start.setAttribute('r','2');start.setAttribute('fill','#b7d2f5');start.setAttribute('fill-opacity','0.68');
const end=document.createElementNS('http://www.w3.org/2000/svg','circle');end.setAttribute('r','2');end.setAttribute('fill','#b7d2f5');end.setAttribute('fill-opacity','0.68');
group.appendChild(line);group.appendChild(start);group.appendChild(end);connections.appendChild(group);
nodes={group,path:line,start,end};connectionNodes.set(item.path,nodes);
}
if(changed.has(item.path))nodes.group.setAttribute('data-changed','true');else nodes.group.removeAttribute('data-changed');
currentLinks.push(item);
if(traceNode(item.from)&&traceNode(item.to))visible++;
}
linkCountNode.textContent=String(visible);
drawConnections();
}
window.addEventListener('resize',drawConnections,{passive:true});
window.addEventListener('scroll',drawConnections,{passive:true});
function resetKnown(){
knownItems=new Set();knownCouplets=new Map();knownVectors=new Map();knownTransforms=new Map();knownSounds=new Map();knownLinks=new Map();initialized=false;
}
function snapshotLabel(item){
const date=String(item.commit_at||'').replace('T',' ').slice(0,16);
const subject=String(item.subject||item.commit||'snapshot');
return date+' · '+subject.slice(0,54);
}
function populateHistory(){
while(historySelect.options.length>1)historySelect.remove(1);
for(const item of historySnapshots){
if(!item||!item.commit||item.commit===liveManifest?.commit)continue;
const option=document.createElement('option');option.value=item.commit;option.textContent=snapshotLabel(item);historySelect.appendChild(option);
}
}
async function loadHistory(){
try{
const url=new URL('./history.json',location.href);url.searchParams.set('_',String(Date.now()));
const response=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw Error('history '+response.status);
const data=await response.json();if(!data||!Array.isArray(data.snapshots))throw Error('invalid history');
historySnapshots=data.snapshots;historyLoaded=true;if(liveManifest)populateHistory();
}catch(e){historySelect.title='Historical states are unavailable right now.'}
}
historySelect.addEventListener('change',()=>{
selectedHistory=historySelect.value||'now';stopAllSounds();resetKnown();latencyNode.textContent='—';
document.body.dataset.view=selectedHistory==='now'?'live':'past';
setState('wait',selectedHistory==='now'?'LOADING':'LOADING PAST');
poll();
});
async function poll(){if(busy)return;busy=true;try{
const url=new URL('./manifest.json',location.href);url.searchParams.set('_',String(Date.now()));
const response=await fetch(url,{cache:'no-store',headers:{Accept:'application/json'}});if(!response.ok)throw Error('manifest '+response.status);
const current=await response.json();if(!current||!Array.isArray(current.items)||!Array.isArray(current.couplets))throw Error('invalid manifest');
liveManifest=current;
if(historyLoaded&&historySelect.options.length===1)populateHistory();
const isHistorical=selectedHistory!=='now';
const manifest=isHistorical?historySnapshots.find(item=>item&&item.commit===selectedHistory):current;
if(!manifest)throw Error('selected history snapshot is unavailable');
const viewManifest={...manifest,ref:isHistorical?String(manifest.ref||manifest.commit):'main'};
const ids=viewManifest.items.filter(id=>typeof id==='string'&&id.length>0),nextItems=new Set(ids),freshItems=new Set();
const couplets=viewManifest.couplets.filter(item=>item&&typeof item.path==='string'&&typeof item.text==='string'),nextCouplets=new Map(),changedCouplets=new Set();
for(const item of couplets){nextCouplets.set(item.path,item.text);if(knownCouplets.has(item.path)&&knownCouplets.get(item.path)!==item.text)changedCouplets.add(item.path);else if(initialized&&!knownCouplets.has(item.path))changedCouplets.add(item.path)}
const vectors=(Array.isArray(viewManifest.vectors)?viewManifest.vectors:[]).filter(item=>item&&typeof item.path==='string'&&item.path.startsWith('vectors/')&&item.path.toLowerCase().endsWith('.svg')),nextVectors=new Map(),changedVectors=new Set();
for(const item of vectors){const revision=String(item.digest||viewManifest.commit||'');nextVectors.set(item.path,revision);if(knownVectors.has(item.path)&&knownVectors.get(item.path)!==revision)changedVectors.add(item.path);else if(initialized&&!knownVectors.has(item.path))changedVectors.add(item.path)}
const transformations=(Array.isArray(viewManifest.transformations)?viewManifest.transformations:[]).filter(item=>item&&typeof item.path==='string'&&item.path.startsWith('transformations/')&&item.mode==='text-particles'&&typeof item.source==='string'&&typeof item.source_text==='string'),nextTransforms=new Map(),changedTransforms=new Set();
for(const item of transformations){const revision=String(item.digest||hash(item.source_text));nextTransforms.set(item.path,revision);if(knownTransforms.has(item.path)&&knownTransforms.get(item.path)!==revision)changedTransforms.add(item.path);else if(initialized&&!knownTransforms.has(item.path))changedTransforms.add(item.path)}
const sounds=(Array.isArray(viewManifest.sounds)?viewManifest.sounds:[]).filter(item=>item&&typeof item.path==='string'&&item.path.startsWith('sounds/')&&item.mode==='sequence'&&Array.isArray(item.notes)),nextSounds=new Map(),changedSounds=new Set();
for(const item of sounds){const revision=String(item.digest||JSON.stringify(item.notes));nextSounds.set(item.path,revision);if(knownSounds.has(item.path)&&knownSounds.get(item.path)!==revision)changedSounds.add(item.path);else if(initialized&&!knownSounds.has(item.path))changedSounds.add(item.path)}
const links=(Array.isArray(viewManifest.links)?viewManifest.links:[]).filter(item=>item&&typeof item.path==='string'&&item.path.startsWith('links/')&&item.path.toLowerCase().endsWith('.json')&&typeof item.from==='string'&&typeof item.to==='string'),nextLinks=new Map(),changedLinks=new Set();
for(const item of links){const revision=String(item.digest||item.from+'→'+item.to);nextLinks.set(item.path,revision);if(knownLinks.has(item.path)&&knownLinks.get(item.path)!==revision)changedLinks.add(item.path);else if(initialized&&!knownLinks.has(item.path))changedLinks.add(item.path)}
if(initialized&&!isHistorical){
ids.forEach(id=>{if(!knownItems.has(id))freshItems.add(id)});
const hasNew=freshItems.size>0||changedCouplets.size>0||changedVectors.size>0||changedTransforms.size>0||changedSounds.size>0||changedLinks.size>0;
if(hasNew){const stamp=Date.parse(viewManifest.commit_at||'');if(Number.isFinite(stamp)){const seconds=Math.max(0,(Date.now()-stamp)/1000);latencyNode.textContent=seconds<10?seconds.toFixed(1)+'s':Math.round(seconds)+'s'}}
}
if(isHistorical)latencyNode.textContent='—';
renderItems(ids,viewManifest,freshItems);renderCouplets(couplets,viewManifest,changedCouplets);renderVectors(vectors,viewManifest,changedVectors);renderTransformations(transformations,viewManifest,changedTransforms);renderSounds(sounds,viewManifest,changedSounds);renderLinks(links,viewManifest,changedLinks);
knownItems=nextItems;knownCouplets=nextCouplets;knownVectors=nextVectors;knownTransforms=nextTransforms;knownSounds=nextSounds;knownLinks=nextLinks;initialized=true;
document.body.dataset.view=isHistorical?'past':'live';setState(isHistorical?'past':'live',isHistorical?'PAST':'LIVE');
}catch(e){setState('error',initialized?'RETRYING':'WAITING')}finally{busy=false}}

poll();loadHistory();setInterval(poll,POLL_MS);
})();
</script>
