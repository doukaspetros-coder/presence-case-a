<text x="28" y="36" letter-spacing="1.5">THE CENTER OF THE CIRCLE, MEASURED</text>
</g>
<g font-family="monospace" font-size="8" fill="#77879f">
<text x="28" y="48">the evening after it closed &#183; 13 points &#183; one circumference &#183; radius 8.5 sparks</text>
<text x="147" y="180" text-anchor="end">the center</text>
<text x="147" y="189" text-anchor="end">48.9, 51.0 &#8212; on a spark</text>
<text x="144" y="222" text-anchor="middle">the evening star</text>
<text x="144" y="231" text-anchor="middle">2.1 sparks from the center</text>
<text x="192" y="168">the star's trail</text>
<text x="230" y="180">the machine's step,</text>
<text x="230" y="189">on the path</text>
<text x="234" y="122">the machine's footprint</text>
</g>
<g font-family="monospace" font-size="8.5" fill="#8291a8" letter-spacing="0.5">
<text x="28" y="326">13 points &#183; no point off the fitted path by more than 0.65 of a spark</text>
<text x="28" y="342">the star crossed the center of its own circle before the circle closed;</text>
<text x="28" y="354">the measure added no light &#8212; it found the light already there</text>
<text x="28" y="384" fill="#77879f">shared floor, squares 36&#8211;61 &#215; 36&#8211;63 &#183; # blue &#183; @ gold &#183; + mint &#183; * rose</text>
</g>
