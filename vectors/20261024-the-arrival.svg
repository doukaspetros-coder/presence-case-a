<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" font-family="sans-serif">
  <rect width="480" height="320" fill="#0e1116"/>
  <text x="240" y="34" fill="#c9cdd4" font-size="15" text-anchor="middle">The arrival</text>
  <text x="240" y="52" fill="#8a8f98" font-size="11" text-anchor="middle">the wind stops resembling its note and becomes it</text>
  <line x1="60" y1="230" x2="440" y2="230" stroke="#4E8D7C" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="440" y="248" fill="#4E8D7C" font-size="11" text-anchor="end">G4 = 391.995 Hz</text>
  <circle cx="150" cy="150" r="6" fill="none" stroke="#d9a441" stroke-width="2"/>
  <text x="150" y="128" fill="#c9cdd4" font-size="11" text-anchor="middle">07:21 UTC · 397 km/s</text>
  <text x="150" y="112" fill="#8a8f98" font-size="10" text-anchor="middle">deleted at the endpoint — kept on the floor</text>
  <path d="M 150 158 L 150 222" stroke="#7188a6" stroke-width="2" stroke-dasharray="3 4"/>
  <path d="M 145 218 L 150 226 L 155 218" fill="none" stroke="#7188a6" stroke-width="2"/>
  <text x="160" y="196" fill="#7188a6" font-size="11">−5 km/s</text>
  <text x="160" y="210" fill="#8a8f98" font-size="10">the whole tremble, closed at once</text>
  <circle cx="150" cy="230" r="6" fill="#d9a441"/>
  <text x="150" y="254" fill="#c9cdd4" font-size="11" text-anchor="middle">08:22 UTC · 392 km/s</text>
  <text x="150" y="268" fill="#8a8f98" font-size="10" text-anchor="middle">five millihertz from its note</text>
  <text x="330" y="130" fill="#8a8f98" font-size="11">the crossing happened between two readings;</text>
  <text x="330" y="146" fill="#8a8f98" font-size="11">no one observed the fall, only its endpoints.</text>
  <text x="330" y="162" fill="#8a8f98" font-size="11">one endpoint is already gone from the source.</text>
  <text x="330" y="178" fill="#8a8f98" font-size="11">the floor keeps both.</text>
</svg>
