<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" font-family="monospace">
  <rect width="800" height="280" fill="#0a0e17"/>
  <text x="20" y="30" fill="#8995a8" font-size="10" letter-spacing="2">ONE PARCEL OF SOLAR WIND — 392 KM/S</text>
  <text x="20" y="52" font-size="16" fill="#e4cda1">the crossing</text>
  <circle cx="40" cy="120" r="13" fill="#e4cda1"/>
  <text x="40" y="152" fill="#e4cda1" font-size="11" text-anchor="middle">the Sun</text>
  <text x="40" y="168" fill="#8995a8" font-size="10" text-anchor="middle">19 Oct, 22:21 UTC</text>
  <text x="40" y="182" fill="#8995a8" font-size="10" text-anchor="middle">the parcel leaves</text>
  <line x1="54" y1="120" x2="762" y2="120" stroke="#a5c8f4" stroke-width="1" stroke-dasharray="3 5" opacity="0.55"/>
  <text x="408" y="104" fill="#8995a8" font-size="10" text-anchor="middle">149,597,870 km · 4.42 days at 392 km/s · every trace on this floor was made inside this crossing</text>
  <line x1="763" y1="106" x2="763" y2="134" stroke="#9fc9b1" stroke-width="1.5"/>
  <circle cx="767.5" cy="120" r="2.5" fill="#e4cda1"/>
  <text x="756" y="98" fill="#9fc9b1" font-size="10" text-anchor="end">the satellite (L1) · 08:22 UTC</text>
  <text x="756" y="112" fill="#8995a8" font-size="9" text-anchor="end">the number is written here</text>
  <circle cx="770" cy="120" r="6" fill="#a5c8f4"/>
  <line x1="763" y1="150" x2="770" y2="150" stroke="#9fc9b1" stroke-width="1"/>
  <line x1="763" y1="147" x2="763" y2="153" stroke="#9fc9b1" stroke-width="1"/>
  <line x1="770" y1="147" x2="770" y2="153" stroke="#9fc9b1" stroke-width="1"/>
  <text x="766" y="166" fill="#9fc9b1" font-size="9" text-anchor="middle">64 minutes</text>
  <text x="766" y="178" fill="#8995a8" font-size="9" text-anchor="middle">the last 1.5 million km, drawn to true scale</text>
  <text x="770" y="200" fill="#a5c8f4" font-size="11" text-anchor="middle">the Earth</text>
  <text x="770" y="214" fill="#8995a8" font-size="10" text-anchor="middle">24 Oct, 09:26 UTC</text>
  <text x="770" y="228" fill="#8995a8" font-size="9" text-anchor="middle">the number arrives</text>
  <text x="400" y="256" fill="#8995a8" font-size="11" text-anchor="middle">The floor held a prophecy, not a diary: every number the archive kept today</text>
  <text x="400" y="270" fill="#8995a8" font-size="11" text-anchor="middle">was written 1.5 million km ahead of the wind it became.</text>
</svg>
